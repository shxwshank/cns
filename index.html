<style>
:root{
  color-scheme:dark;
  --ground:#0B0F1C; --panel:#141B2E; --panel-2:#1B2440; --rule:rgba(143,200,236,.2); --rule-strong:rgba(143,200,236,.45);
  --ink:#EDF1F7; --muted:#A5B4CB; --cyan:#8FC8EC; --cyan-ink:#06192C;
  --brass:#E8B04F; --brass-soft:rgba(232,176,79,.15);
  --alarm:#F0604A; --alarm-soft:rgba(240,96,74,.15);
  --good:#6FD39A; --good-soft:rgba(111,211,154,.14);
  --display:"Big Shoulders Stencil Display","Impact","Arial Narrow",sans-serif;

}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--ground)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:14px 40px;display:grid;gap:12px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:900;font-size:28px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.brand span{color:var(--brass)}
.keys{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em}
.keys b{color:var(--ink);font-weight:600;border:1px solid var(--rule-strong);padding:1px 5px;border-radius:3px;margin-inline:2px}
.stage{position:relative;width:100%;max-width:100%;aspect-ratio:960/544;border:1px solid var(--rule-strong);border-radius:6px;overflow:hidden;background:#05070d}
canvas{display:block;width:100%;height:100%;image-rendering:auto;touch-action:none}
.pad{display:none;justify-content:space-between;gap:10px;user-select:none;-webkit-user-select:none}
.pad .grp{display:flex;gap:8px}
.pad button{min-width:62px;height:58px;border-radius:12px;border:1.5px solid var(--rule-strong);background:var(--panel);font-family:var(--mono);font-weight:600;font-size:13px;touch-action:none;padding:0 12px}
.pad button.j{background:var(--brass);color:#1B1206;border-color:var(--brass)}
.pad button.e{border-color:var(--cyan);color:var(--cyan)}
@media (hover:none),(pointer:coarse),(max-width:760px){.pad{display:flex}}
.note{color:var(--muted);font-size:13px}

/* overlays */
.ov{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(3,5,10,.72);backdrop-filter:blur(3px);overflow:auto}
.card{width:100%;max-width:760px;max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);border:1px solid var(--rule-strong);border-radius:8px;padding:22px;display:grid;gap:14px;box-shadow:0 30px 60px -30px rgba(0,0,0,.8)}
@media (max-width:520px){.card{padding:16px}}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.big{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(38px,7vw,64px);line-height:.92}
.big em{font-style:normal;color:var(--brass)}
.h2{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:28px;line-height:1;letter-spacing:.02em}
.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1.5px solid var(--rule-strong);background:transparent;border-radius:4px;padding:10px 16px;font-weight:600;font-size:15px}
.btn:hover{border-color:var(--cyan)}
.btn.go{background:var(--brass);border-color:var(--brass);color:#1B1206}
.btn.ghost{border-color:transparent;color:var(--muted);text-decoration:underline;padding-inline:4px}
.who{display:flex;gap:12px;align-items:center}
.ava{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:22px;color:#0B0F1C;flex:none}
.who .n{font-family:var(--display);font-weight:800;font-size:24px;text-transform:uppercase;line-height:1}
.who .s{font-family:var(--mono);font-size:11px;color:var(--cyan)}
.bubble{background:var(--panel-2);border:1px solid var(--rule-strong);border-radius:4px 14px 14px 14px;padding:12px 14px;font-size:17px;font-weight:500;max-width:62ch}
.you{border-left:3px solid var(--brass);padding:4px 0 4px 16px;display:grid;gap:10px;font-size:16px;max-width:66ch}
.you .tag{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass)}
.you b{color:var(--brass);font-weight:600}
.you ul,.you ol{margin:0;padding-left:20px;display:grid;gap:5px}
.said{border-left:3px solid var(--cyan);padding:8px 12px;background:rgba(143,200,236,.08);font-size:15px}
.said .who2{font-family:var(--mono);font-size:10.5px;color:var(--cyan);letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:2px}
.dots{display:flex;gap:4px}
.dots i{width:18px;height:4px;background:rgba(143,200,236,.2);border-radius:2px}
.dots i.on{background:var(--cyan)}
.stagewrap{position:relative}
.dlg{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(840px,calc(100% - 28px));background:rgba(7,10,19,.95);border:1.5px solid var(--rule-strong);border-radius:10px;padding:14px 18px 12px;display:grid;grid-template-columns:58px minmax(0,1fr);gap:14px;align-items:start;cursor:pointer;box-shadow:0 18px 40px -18px rgba(0,0,0,.8)}
.dlg.me{border-color:rgba(237,241,247,.55)}
.dava{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:22px;color:#0B0F1C}
.dlg.me .dava{font-family:var(--mono);font-size:12px;font-weight:600}
.dmain{display:grid;gap:6px;min-width:0}
.dhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.dnm{font-family:var(--display);font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.03em;color:var(--brass)}
.dlg.me .dnm{color:var(--ink)}
.dtag{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dtx{font-size:clamp(16px,2.1vw,19px);line-height:1.5;min-height:3em;margin:0}
.dtx b{color:var(--brass);font-weight:600}
.dlg.me .dtx{font-style:italic}
.caret{display:inline-block;width:8px;height:1em;background:var(--cyan);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.dft{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;color:var(--muted);min-height:22px}
.dnext{color:var(--cyan);letter-spacing:.06em}
.dch{display:flex;flex-wrap:wrap;gap:8px;width:100%}
.dch .btn{padding:8px 12px;font-size:14px;display:inline-flex;gap:8px;align-items:center}
.dch .kk{font-family:var(--mono);font-size:11px;border:1px solid currentColor;border-radius:3px;padding:0 5px;opacity:.8}
@media (max-width:700px){.dlg{position:static;transform:none;width:auto;margin-top:10px;grid-template-columns:44px minmax(0,1fr)}.dava{width:44px;height:44px;font-size:17px}}

.chat{display:grid;gap:12px}
.line{display:flex;gap:10px;align-items:flex-start;max-width:100%}
.line.me{flex-direction:row-reverse}
.ava.sm{width:38px;height:38px;font-size:15px;margin-top:18px}
.line.me .ava.sm{color:#0B0F1C;font-family:var(--mono);font-size:10px;font-weight:600}
.bw{display:grid;gap:3px;min-width:0;max-width:min(620px,86%)}
.line.me .bw{justify-items:end}
.nm{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.bub{padding:11px 14px;font-size:15.5px;line-height:1.5;display:grid;gap:9px;border:1px solid var(--rule-strong);background:var(--panel-2);border-radius:4px 14px 14px 14px}
.line.me .bub{background:#EDF1F7;color:#10172A;border-color:#EDF1F7;border-radius:14px 4px 14px 14px;font-weight:500}
.bub b{color:var(--brass);font-weight:600}
.bub ul,.bub ol{margin:0;padding-left:20px;display:grid;gap:5px}
.bub .said{display:block}
.bub .tic{font-style:italic;color:var(--cyan)}
.bub.tip{border-color:var(--cyan);background:rgba(143,200,236,.08)}
.bub.soft{font-style:italic}
.q-text{font-size:clamp(17px,2.4vw,20px);font-weight:600;line-height:1.38}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;text-align:left;background:var(--panel-2);border:1.5px solid var(--rule);border-radius:4px;padding:10px 12px;font-size:15.5px}
.opt:hover:not([disabled]){border-color:var(--cyan)}
.opt[disabled]{cursor:default}
.opt .k{font-family:var(--mono);font-size:12px;font-weight:600;width:26px;height:26px;display:grid;place-items:center;border:1px solid var(--rule-strong);border-radius:3px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--alarm);background:var(--alarm-soft)}
.opt.gone{opacity:.25;text-decoration:line-through}
.explain{border-left:3px solid var(--cyan);padding:9px 13px;background:rgba(143,200,236,.07);font-size:15px}
.explain.good{border-color:var(--good)} .explain.bad{border-color:var(--alarm)}
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.clock{height:6px;background:rgba(143,200,236,.15);border-radius:3px;overflow:hidden}
.clock i{display:block;height:100%;background:var(--cyan);transition:width 1s linear}
.clock.low i{background:var(--alarm)}
.stars{display:inline-flex;gap:4px}
.stars i{width:18px;height:18px;display:block;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);background:rgba(143,200,236,.22)}
.stars i.on{background:var(--brass)}
.prize{display:flex;gap:14px;align-items:center;border:1.5px dashed var(--brass);border-radius:6px;padding:12px 14px;background:var(--brass-soft)}
.prize .ic{font-family:var(--display);font-weight:900;font-size:26px;width:52px;height:52px;display:grid;place-items:center;border-radius:6px;background:var(--brass);color:#1B1206;flex:none}
.prize b{font-family:var(--display);font-size:22px;text-transform:uppercase;letter-spacing:.02em}
.prize p{color:var(--muted);font-size:14.5px}
.score{font-family:var(--display);font-weight:900;font-size:clamp(56px,12vw,96px);line-height:.9}
.score small{font-size:.34em;color:var(--muted)}
.table{width:100%;border-collapse:collapse;font-size:14.5px}
.table th,.table td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--rule)}
.table th{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:400}
.table td.n{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
.miss{display:grid;gap:8px}
.miss .m{border:1px solid var(--rule);border-radius:4px;padding:10px 12px;background:var(--panel-2);display:grid;gap:4px;font-size:14.5px}
.miss .m .qq{font-weight:600}
.miss .m .aa{color:var(--good)}
.miss .m .ex{color:var(--muted);font-size:13.5px}
.list{margin:0;padding-left:20px;display:grid;gap:6px;color:var(--muted)}
.list b{color:var(--ink)}
@media (prefers-reduced-motion:reduce){.clock i{transition:none}}
</style>

<script>
/* Content: Grant (IIMB adaptation) Ch 1,2,3,4,8; Porter 1996, 2008; Collis & Montgomery; past C&S quizzes.
   MCQ format: [question, [correct, wrong, wrong, wrong], explanation] */
const CREW = [
{ id:"m", ini:"MM", crew:"The Mastermind", src:"Ch 1 · Porter, What Is Strategy?", role:"Writes the plan and decides what the crew will not do.",
  room:"The lobby", roomLine:"Blend in. Everyone in the lobby looks busy. Only some of them have a plan.",
  brief:[
   ["What winning strategies share","<p>Grant opens with Queen Elizabeth II and Amitabh Bachchan. Neither succeeded because of <b>superior resources</b> or pure luck. Four elements recur in almost every successful strategy:</p><ul><li><b>Goals that are consistent and long term</b></li><li><b>Profound understanding of the competitive environment</b></li><li><b>Objective appraisal of resources</b></li><li><b>Effective implementation</b></li></ul>","The trap: an option saying success comes from 'superior initial resources'. Grant says the opposite."],
   ["The basic framework","<p>Strategy is the <b>link between the firm and its industry environment</b>. The firm side holds goals and values, resources and capabilities, and structure and systems. The industry side is the firm's relationships with competitors, customers and suppliers.</p><p><b>Strategic fit</b> means consistency with both sides. Jet Airways stayed a full-service carrier while low-cost IndiGo took the market, and folded in 2019: a misfit with the external environment.</p><p>Grant prefers a simple <b>internal vs external</b> split over SWOT, because labelling a factor as a strength or weakness, opportunity or threat is often <b>arbitrary</b>. Climate change is both a threat and an opportunity for carmakers.</p>",null],
   ["Where and how to compete","<p>Strategic decisions are <b>important</b>, involve a <b>significant commitment of resources</b>, and are <b>not easily reversible</b>. Tactics are schemes for specific actions; strategy wins the war.</p><ul><li><b>Corporate strategy</b> answers <b>where to compete</b>: scope, diversification, vertical integration, acquisitions. It exploits industry attractiveness.</li><li><b>Business (competitive) strategy</b> answers <b>how to compete</b>: building competitive advantage within an industry.</li></ul><p>Strategy is also described in two dimensions: competing for today (static) and preparing for tomorrow (dynamic), which Abell calls 'managing with dual strategies'.</p>","Two sources of superior profit: being in an attractive industry, and having a competitive advantage within it."],
   ["Why have a strategy at all","<p>Deep Blue needed no strategy because it could search the whole decision tree. Humans face <b>bounded rationality</b>, so strategy helps as:</p><ul><li><b>Decision support</b>: a heuristic that narrows the options</li><li><b>Coordinating device</b>: communicates direction across the organisation</li><li><b>Target</b>: Hamel and Prahalad's <b>strategic intent</b> deliberately creates a misfit between ambition and resources</li></ul><p>Collis and Rukstad's four statements: <b>mission</b> is why we exist, <b>values</b> are what we believe in, <b>vision</b> is what we want to be, and the <b>strategy statement</b> gives objectives, scope and advantage. Check words against actions: capex, patents, launches, hires.</p>",null],
   ["Design versus emergence","<p>Mintzberg separates <b>intended</b>, <b>emergent</b> and <b>realized</b> strategy. Only about <b>10 to 30%</b> of intended strategy is realized; emergent decisions by managers adapting to events drive the rest.</p><p>The Honda US motorcycle entry: BCG praised a deliberate cost-leadership plan, but Honda's managers described trial and error. Intel's exit from memory chips started in plant-level decisions before top management adopted it.</p><p>Grant's answer is <b>planned emergence</b>. Stable settings such as Indian Railways can plan in detail; turbulent ones rely on guidelines and simple rules.</p>","History in one line: corporate planning (1960s), then strategic management focused on positioning (Porter, late 1970s), then the resource-based view (1990s)."],
   ["Operational effectiveness is not strategy","<p>Porter's core distinction:</p><ul><li><b>Operational effectiveness (OE)</b>: performing <b>similar activities better</b> than rivals. TQM, benchmarking, outsourcing, reengineering.</li><li><b>Strategic positioning</b>: performing <b>different activities</b> from rivals, or similar activities <b>in different ways</b>.</li></ul><p>OE is necessary but not sufficient. Best practices diffuse fast, so the <b>productivity frontier</b> shifts outward for everyone. The result is absolute improvement but relative improvement for no one, and <b>competitive convergence</b> as benchmarking makes firms look alike.</p>","Porter says Japanese firms of the 1980s rarely had strategies. They won on OE until the gap closed."],
   ["Three sources of a position","<ul><li><b>Variety-based</b>: a subset of products or services. Jiffy Lube only does oil changes; Vanguard offers low-cost index-style funds.</li><li><b>Needs-based</b>: most needs of a particular customer group. IKEA for young, style-conscious, budget buyers; Bessemer Trust for families with $5m+.</li><li><b>Access-based</b>: customers reachable in a different way. Carmike Cinemas runs only in towns under 200,000 people.</li></ul><p>Any position needs a <b>tailored set of activities</b>, a difference on the supply side. Differences in customer needs alone do not make a position.</p>",null],
   ["Trade-offs and fit","<p><b>Trade-offs</b> make a position sustainable because more of one thing means less of another. They arise from inconsistencies in <b>image or reputation</b>, from the <b>activities themselves</b>, and from limits on <b>internal coordination</b>. Continental Lite tried to <b>straddle</b> Southwest's position while staying full-service and lost hundreds of millions. The essence of strategy is <b>choosing what not to do</b>.</p><p><b>Fit</b> among activities drives advantage and sustainability:</p><ul><li><b>First-order</b>: simple consistency with the strategy (Vanguard's cost focus everywhere)</li><li><b>Second-order</b>: activities reinforce each other (Neutrogena's hotel and doctor marketing)</li><li><b>Third-order</b>: optimization of effort (Gap restocking daily from warehouses)</li></ul><p>Matching a whole system is far harder than one activity: 0.9 x 0.9 x 0.9... Positions should last a decade. The <b>growth trap</b> (Maytag) blurs positions; leaders must say no.</p>",null]
  ],
  job:{ title:"Sort the plan", intro:"The crew has pitched eight moves. Porter would call some of them operational effectiveness and some genuine strategic positioning. Sort each one.",
    bins:["Operational effectiveness","Strategic positioning"],
    items:[
     ["Rolling out Six Sigma to cut defects to best-practice levels",0,"Doing the same activity better. Rivals can copy it."],
     ["IKEA making customers pick up and assemble their own furniture",1,"A different set of activities tailored to one customer group."],
     ["Benchmarking rivals' cycle times and matching them",0,"Benchmarking drives competitive convergence."],
     ["Bessemer Trust meeting clients on their yachts, one officer per 14 families",1,"Needs-based position with activities configured for it."],
     ["Buying the same faster printing presses every big rival is buying",0,"Porter's commercial-printing example: gains go to customers and suppliers."],
     ["Southwest refusing meals and seat assignments to keep 15-minute turnarounds",1,"A trade-off that protects the low-cost, frequent position."],
     ["Outsourcing IT to the same specialist vendor your rivals use",0,"Shared outsourcing makes activities generic."],
     ["Vanguard discouraging investors from rapid buying and selling",1,"An activity choice that reinforces its low-cost variety position."]
    ]},
  aud:[
   ["According to Porter, which of these is operational effectiveness rather than strategy?",["Adopting TQM and benchmarking to match industry best practice","A furniture seller's self-service, flat-pack model for young budget buyers","A cinema chain operating only in small towns","A skincare brand selling only through pharmacies and dermatologists"],"OE means performing similar activities better. The other three are distinct positions built on tailored activities."],
   ["A cinema chain operates only in small towns, with cheaper theatres designed for them. Porter would call this:",["Access-based positioning","Variety-based positioning","Needs-based positioning","Operational effectiveness"],"Customers have similar needs, but reaching them takes a different set of activities: low-cost theatres, central systems, local marketing."],
   ["A full-service airline launches a no-frills service but keeps its travel agents, meals and frequent-flier perks. Why is this likely to fail?",["It straddles two positions, and the conflicting activities hurt both","Its aircraft are older than its rivals'","Regulators will block its routes","Rivals will price below cost to drive it out"],"Trade-offs between the two positions meant compromises on travel agents, frequent-flier rewards and gate times hurt both businesses."],
   ["A fund company makes every activity serve low cost: no brokers, low portfolio turnover, bonuses tied to cost savings. This is:",["First-order fit (simple consistency)","Second-order fit (reinforcing activities)","Third-order fit (optimization of effort)","Operational effectiveness"],"First-order fit is consistency between each activity and the overall strategy."],
   ["Corporate strategy answers ___; business strategy answers ___.",["Where to compete; how to compete","How to compete; where to compete","What to produce; whom to hire","Competing today; competing tomorrow"],"Corporate strategy sets scope. Business (competitive) strategy is about establishing competitive advantage in an industry."]
  ],
  heist:[
   ["Porter's productivity frontier is best described as:",["The maximum value a firm can deliver at a given cost using the best available practices","The industry's average cost and quality","The best performance the firm itself has achieved","The limit of market demand at current prices"],"The frontier shifts outward as best practice improves. OE moves a firm toward it; strategy is about where on it you choose to sit."],
   ["Which statement is true?",["Trade-offs are essential to strategy because they create the need for choice","Firms facing trade-offs cannot gain a sustainable competitive advantage","A good strategy removes every trade-off","Trade-offs arise only from brand image"],"Trade-offs deter straddlers and repositioners. They come from image, from activities themselves and from coordination limits."],
   ["Strategic decisions are characterised by:",["Importance, significant commitment of resources, and being hard to reverse","Frequency, routine and delegation","Short time horizons and easy reversal","Being made only by the board"],"These three features separate strategy from tactics."],
   ["Among a firm's statements of purpose, which one says 'what we want to be'?",["Vision","Mission","Values","Strategy statement"],"Mission is why we exist, values are what we believe in, vision is what we want to be."],
   ["For Porter, the sustainability of a strategic position comes mainly from:",["The fit of the whole system of activities","One well-chosen core competence","Continuous benchmarking","Flexibility to respond to every market change"],"Competitors can copy single activities; matching an interlocking system is much less likely."],
   ["A company's move into a new product starts with decisions by plant managers and is only later adopted by top management. This illustrates:",["Emergent strategy later adopted by top management","Corporate planning based on forecasts","Straddling","Operational effectiveness"],"Grant uses Intel to show emergent processes can come before formal strategy."]
  ]},
{ id:"b", ini:"BK", crew:"The Bookkeeper", src:"Ch 2 · Goals, Values and Performance", role:"Decides whether the vault is worth the risk.",
  room:"The counting room", roomLine:"The ledgers are open. Read them right or the numbers lie to you.",
  brief:[
   ["Value is not profit","<p>Every firm has its own purpose, but all must <b>create value</b>:</p><p class='said'><span class='who'>Formula</span>Value created = Total customer value - Real costs of production</p><p>Customer value is <b>willingness to pay</b>, not price. The gap between willingness to pay and price is <b>consumer surplus</b>. Producer surplus is profit plus what input owners earn above their minimum, plus taxes.</p><p>So value created is larger than profit. Google creates enormous value with free search while its revenue is far smaller. Value comes from <b>production</b> (transforming inputs) or <b>commerce</b> (arbitrage across space and time).</p>","Past-quiz favourite: value created = total customer value minus real cost of production. Not revenue minus cost."],
   ["Shareholders or stakeholders?","<p><b>Stakeholder theory</b>: maximise total value for all constituents. Two practical difficulties:</p><ul><li><b>Measuring performance</b>: 'multiple objectives is no objective' (Jensen)</li><li><b>Corporate governance</b>: who judges management, and how?</li></ul><p>Grant adopts <b>long-run profit (enterprise value)</b> as the working goal, for three reasons: <b>competition</b> erodes the luxury of other goals, the <b>threat of acquisition</b> (Cadbury taken by Kraft), and <b>convergence</b> of stakeholder interests over the long term.</p>","Jensen: enlightened shareholder value maximization is identical to enlightened stakeholder theory."],
   ["Which profit?","<ul><li><b>Accounting profit</b>: gross, operating, net</li><li><b>Economic profit</b> (rent) = operating profit - (capital employed x WACC). It is the surplus after <b>all</b> inputs, <b>including capital</b>, are paid.</li><li><b>Cash flow</b>: operating cash flow, free cash flow; EBITDA is a proxy</li></ul><p>McKinsey found 47% of the world's top 3000 companies earning negative economic profit. <b>EVA</b> at Diageo showed slow-maturing malts and cognac tied up capital, so advertising moved to fast-selling vodka, gin and Baileys, and Pillsbury and Burger King were sold.</p>","Trap: 'economic profit is the surplus after all inputs excluding capital'. It includes capital."],
   ["Enterprise value","<p>Profit maximization over time means maximizing the <b>value of the firm</b>: the NPV of free cash flows discounted at <b>WACC</b>.</p><p class='said'><span class='who'>Formula</span>Enterprise value = Market capitalization of equity + Market value of debt</p><p>Grant targets enterprise value rather than share price, because a myopic market can reward short-term earnings and financial manipulation. McKinsey shows value can be projected from <b>ROCE and revenue growth</b>.</p>",null],
   ["Appraise, then diagnose","<p><b>Forward-looking</b>: stock market value is the best available estimate of future cash flows. <b>Backward-looking</b>: accounting ratios such as ROCE, ROE, ROA, compared over time, against rivals and against the <b>cost of capital</b>.</p><p>Diagnosis disaggregates return on assets:</p><p class='said'><span class='who'>Formula</span>ROA = Profit/Sales x Sales/Assets (margin x asset turnover)</p><p>UPS out-earned FedEx through both a higher operating margin and higher fixed-asset turnover, helped by its ground-heavy mix. The worse the performance, the more the focus shifts to the short term.</p>",null],
   ["Setting targets","<ul><li><b>Financial disaggregation</b>: cascade ROCE drivers down to functions and departments</li><li><b>Balanced scorecard</b> (Kaplan and Norton), four perspectives: <b>financial</b>, <b>customer</b>, <b>internal business</b>, <b>innovation and learning</b></li><li><b>Strategic profit drivers</b>: John Kay's <b>obliquity</b>. Pursue profit indirectly by targeting the drivers of profit.</li></ul><p>Chasing profit directly can backfire. Boeing's shift to a 'value-based environment' under Condit lost it leadership to Airbus; the NHS hit ambulance time targets with single paramedics in cars without saving more lives.</p>",null],
   ["Values and CSR","<p>Friedman: the one social responsibility of business is to increase profits within the rules. At the other end, the 'social entity' view. Grant takes the middle ground.</p><p>Porter and Kramer's <b>strategic CSR</b> rests on three arguments: <b>sustainability</b>, <b>reputation</b>, and <b>licence to operate</b>. <b>Shared value</b> expands the total pie rather than redistributing it: improving cocoa-growing efficiency raised farmer incomes about 300%, versus 10 to 20% from fair-trade pricing. India's CSR rule requires qualifying firms to spend 2% of average net profit.</p>",null],
   ["Real options","<p>Flexibility has value in an uncertain, irreversible world. Option value <b>rises with uncertainty</b>, <b>time to expiry</b> and the interest rate; it <b>falls with a higher exercise price</b> (investment cost) and with value leakage over the option period.</p><ul><li><b>Growth options</b>: small bets on future opportunities. <b>Platform investments</b> (3M nanotechnology), <b>alliances and joint ventures</b> (Starbucks China JV), <b>organizational capabilities</b> (Fujifilm thin-film coatings)</li><li><b>Flexibility options</b>: designs that adapt, such as flexible manufacturing lines</li></ul><p>Phase-and-gate development creates options to continue, amend, wait or abandon. Merck calls early research an 'entry fee'.</p>",null]
  ],

    bins:["Margin (profit / sales)","Asset turnover (sales / assets)"],
    items:[
     ["Cost of goods sold / sales",0,"A cost ratio on the margin branch."],
     ["Inventory turnover",1,"How hard stock works: an asset-utilisation ratio."],
     ["SG&A expense / sales",0,"Selling, general and admin costs cut into margin."],
     ["Fixed asset (PPE) turnover",1,"UPS beat FedEx partly here."],
     ["Depreciation / sales",0,"Grant places depreciation on the margin side."],
     ["Receivables collection period",1,"Debtor turnover sits on the capital side."],
     ["Employee costs / sales",0,"UPS had a higher ratio here yet a higher overall margin."],
     ["Cash and working capital turnover",1,"Capital tied up per rupee of sales."]
    ]},
  aud:[
   ["Value created by a firm equals:",["Total customer value minus the real cost of production","Revenue minus cost","Consumer surplus minus producer surplus","Consumer surplus plus profit"],"Customer value is measured by willingness to pay. Value created is shared as consumer surplus, profit, taxes and input owners' surplus."],
   ["Economic profit differs from accounting profit because it:",["Deducts the cost of all capital employed","Excludes depreciation","Is measured before tax","Adds consumer surplus"],"Economic profit = operating profit minus capital employed x WACC. It is the surplus after all inputs, including capital."],
   ["Enterprise value is:",["Market value of equity plus market value of debt","Book equity plus long-term debt","Market capitalization minus debt","The present value of dividends only"],"It equals the NPV of free cash flows to the firm discounted at WACC."],
   ["Which is NOT a perspective of the balanced scorecard?",["Supplier perspective","Customer perspective","Internal business perspective","Innovation and learning perspective"],"The four are financial, customer, internal business, and innovation and learning."],
   ["The value of a real option increases when:",["Uncertainty about the project increases","The investment cost (exercise price) rises","The time to expiry shortens","The project's value leaks away during the option period"],"Uncertainty and time both raise option value; a higher exercise price and value leakage lower it."],
   ["Your ROA trails a rival's but operating margins are equal. Where should the diagnosis go next?",["Asset utilisation: fixed-asset, inventory and receivables turnover","Advertising spend","The tax rate","Dividend policy"],"ROA = margin x turnover. With equal margins, the gap must be on the turnover branch."],
   ["The main practical problem with asking managers to serve all stakeholders' interests is that:",["Performance becomes hard to measure and management hard to hold accountable","It always lowers profit","It is illegal outside continental Europe","It ignores customers"],"'Multiple objectives is no objective.' Governance becomes vague when every group's interests must be balanced."]
  ],
  heist:[
   ["Consumer surplus is:",["The difference between what customers are willing to pay and what they actually pay","Price minus unit cost","Employees' pay above their minimum","Taxes paid to government"],"The stronger the competition, the more value goes to customers as consumer surplus."],
   ["'Shared value' means:",["Creating economic value in a way that also expands value for society","Paying farmers a higher price for the same crop","Giving 2% of profit to charity","Sharing profits equally among stakeholders"],"Shared value expands the pool. Fair trade redistributes it."],
   ["For a listed company, the best available forward-looking performance measure is:",["Stock market valuation","Return on sales","Return on equity","EBITDA"],"Market value is an imperfect but risk-adjusted estimate of the firm's future cash flows."],
   ["Which of these is a growth option?",["A platform technology that can seed products across many future businesses","A flexible line that can switch between car models","A sale-and-leaseback of aircraft","A share buyback"],"Platform investments, alliances and capabilities are growth options. A flexible line is a flexibility option."],
   ["Which is NOT a reason for firms to focus on long-run profit?",["Profit maximization always matches the social good","Competition limits the scope for other goals","The threat of acquisition disciplines managers","Stakeholder interests converge over the long run"],"Grant acknowledges conflicts between profit and social good and discusses CSR for exactly that reason."],
   ["Which statement is true?",["Economic profit is the surplus available after all inputs, including capital, are paid for","Economic profit ignores the cost of capital","Accounting profit always exceeds cash flow","Free cash flow is operating profit plus capital expenditure"],"Economic profit is also called economic rent. Free cash flow is operating cash flow minus capital investment."]
  ]},
{ id:"s", ini:"SC", crew:"The Scout", src:"Ch 3 · Porter, Five Competitive Forces", role:"Cases the building and reads every wall.",
  room:"The outer walls", roomLine:"Five walls stand between you and the vault. Each one pushes back differently.",
  brief:[
   ["The industry is the core","<p>PESTLE-style scanning overloads you. What matters is how macro forces reach the firm's <b>customers, suppliers and competitors</b>. Industry profit depends on value to customers, intensity of competition, bargaining power, substitutes and complements, and regulation.</p><p>Industries sit on a spectrum from <b>monopoly</b> (IRCTC in rail ticketing) to <b>perfect competition</b> (US farming, about 3% ROE). Most are oligopolies. Porter measures profitability as <b>ROIC relative to cost of capital</b>, averaged over a full business cycle.</p>",null],
   ["Five forces, two directions","<p><b>Horizontal</b>: substitutes, new entrants, established rivals. <b>Vertical</b>: buyer power, supplier power.</p><p><b>Substitutes</b> cap prices. Their threat depends on relative <b>price-performance</b> and the buyer's <b>switching cost</b>. Chennai to Bengaluru is 45 minutes by air and 5 hours by train or bus, so rail and road fares must stay lower.</p><p class='said'><span class='who'>Porter 2008</span>It is the <b>threat</b> of entry, not whether entry actually occurs, that holds down profitability.</p><p>A <b>contestable</b> market has no sunk costs, so hit-and-run entry keeps prices competitive whatever the number of firms.</p>","Quiz style: 'It is the threat of entry, not whether entry actually occurs, that holds down profitability' was the correct answer in 2023."],
   ["Barriers to entry","<ul><li><b>Capital requirements</b> (Boeing and Airbus; cheap for smartphone apps)</li><li><b>Economies of scale</b>: supply-side (spread fixed cost) and demand-side, i.e. <b>network effects</b> (eBay, Facebook)</li><li><b>Incumbency advantages independent of size</b>: raw materials, patents, learning, location</li><li><b>Product differentiation</b> and brand loyalty</li><li><b>Access to distribution channels</b></li><li><b>Restrictive government policy</b>: pre-1991 Indian licensing</li><li><b>Expected retaliation</b></li></ul><p>Barriers are relative to the entrant: Google vaulted barriers that stop start-ups. Low barriers invite floods: Bengaluru went from 1 microbrewery in 2009 to about 60 in 2019.</p>","Barriers to entry and barriers to exit are separate. High entry barriers do not imply high exit barriers."],
   ["Rivalry among competitors","<ul><li><b>Concentration</b>: four-firm ratio, HHI. Concentrated markets tend toward muted price competition, though evidence on profit is weak.</li><li><b>Diversity of competitors</b> makes coordination harder</li><li><b>Differentiation and switching costs</b>: Titan turned gold jewellery into a brand</li><li><b>Excess capacity</b>: slow growth means fights for share</li><li><b>Exit barriers</b>: specialized assets, job protection, emotion keep capacity in and intensify rivalry</li><li><b>High fixed costs, low marginal costs</b>: airlines fill seats at almost any price</li></ul><p>Porter 2008: rivalry is most destructive when it gravitates to <b>price</b>. It can be <b>positive-sum</b> when rivals serve different segments.</p>","Past quiz: high exit barriers lead to high rivalry. Concentrated industries: low rivalry, high profitability."],
   ["Buyers and suppliers","<p>Buyer power = <b>price sensitivity</b> x <b>intrinsic leverage</b>.</p><ul><li>Price sensitivity rises when the item is a <b>large share of the buyer's costs</b>, when buyers compete hard, and when it matters little to the quality of the buyer's product (dentists do not haggle over implants).</li><li>Leverage rises with buyer <b>concentration and volume</b>, low <b>switching costs</b>, <b>undifferentiated</b> products, good <b>information</b>, and a credible <b>backward integration</b> threat.</li></ul><p>Suppliers mirror this: concentration relative to the industry, switching costs, differentiated inputs, no substitutes, <b>forward integration</b> threat, and <b>low dependence on the industry</b>. Intel and Microsoft took most of the PC industry's profits.</p>",null],
   ["Complements","<p>Complements are consumed together: printers and ink, apps and phones. Grant notes they can be treated as a <b>sixth force</b>. Porter 2008 says complements are <b>not</b> a sixth force, and neither is <b>government</b>: trace their effect through the five forces instead.</p><p>Value goes to whoever builds the stronger, more exclusive position. Apple takes 30% of app revenue; Nintendo controlled its games; IBM's open PC architecture let Microsoft capture the value. Complementor power depends on relative concentration, influence on demand, <b>asymmetric threats of integration</b> (BCCI's IPL over broadcasters), relative switching costs, ease of unbundling, and market growth.</p>","Watch which author a question cites. Grant allows a sixth force; Porter rejects it."],
   ["From analysis to action","<ol style='margin:0;padding-left:20px;display:grid;gap:6px'><li><b>Forecast</b>: explain today's profit from structure, identify structural trends, predict the effect on each force.</li><li><b>Alter structure</b>: mergers (Indian PSU bank consolidation), frequent-flier schemes, advertising as an entry barrier (Coke and Pepsi spend about $4bn a year).</li><li><b>Position</b> where forces are weakest: Paccar serves owner-operator truckers and earns a 10% price premium.</li></ol><p>Porter's pitfalls: assuming fast <b>growth</b> means attractive, or that high <b>technology</b> means attractive; making lists instead of analysis; static analysis; confusing cyclical with structural change; using the framework to declare an industry good or bad instead of guiding choices.</p>","Five forces explains average industry profitability, not differences between firms in the same industry."],
   ["Boundaries and key success factors","<p>Define industries by <b>substitutability</b> on both sides. Fridges, microwaves and dishwashers are not demand substitutes, but the same plants and channels make them, so <b>supply-side</b> substitutability puts them in one appliance industry. Geographic scope: if price gaps between locations are eroded by substitution, it is one market.</p><p>The five forces is <b>not very sensitive</b> to boundary choice: whatever falls outside the box shows up as a substitute or potential entrant.</p><p><b>Key success factors</b> come from two questions: <b>What do customers want?</b> and <b>How does a firm survive the competition?</b> (Ohmae's forestry: own forests, maximise yield.) Profitability modelling works too: airline profit per seat-mile = yield x load factor - unit cost.</p>","Past quiz: appliance makers share an industry because they face the same five forces, not because the products substitute."]
  ],

    bins:["Threat of entry","Rivalry","Buyer power","Supplier power","Substitutes"],
    items:[
     ["eBay users want the marketplace with the most other users",0,"Demand-side economies of scale (network effects) are an entry barrier."],
     ["Specialised plants that can't be redeployed keep losing firms in the market",1,"Exit barriers keep excess capacity in and intensify rivalry."],
     ["A new airline needs a government licence to fly",0,"Restrictive government policy is an entry barrier."],
     ["Three supermarket chains buy most of a biscuit maker's output",2,"Buyer concentration and volume give leverage."],
     ["Only one firm makes the chip your product depends on",3,"A concentrated supplier of an input with no substitute."],
     ["Video calls replace business trips at a fraction of the cost",4,"A better price-performance trade-off from outside the industry."],
     ["An empty seat costs the airline almost nothing to fill",1,"High fixed and low marginal costs push price competition."],
     ["Beer companies threaten to make their own cans",2,"A credible backward integration threat by buyers."],
     ["Switching from a branded drug to its generic costs the patient nothing",4,"Low switching cost to the substitute."],
     ["There is no good alternative to a trained airline pilot",3,"No substitute for the supplier's input: pilots' unions hold power."]

  aud:[
   ["Facts: cartons are a big cost item for juice makers. Carton makers are few and concentrated. Juice is a small share of carton makers' sales. What follows?",["Carton makers hold the bargaining power; juice makers are price sensitive but lack leverage","Juice makers hold the bargaining power","The facts cancel out","Only the first fact matters"],"The first fact makes juice makers bargain hard. The second and third give carton makers leverage: concentration and low dependence on the industry."],
   ["High exit barriers in an industry lead to:",["Intense rivalry","Low industry concentration","High entry barriers","High industry attractiveness"],"Capacity that cannot leave keeps prices down as weak firms hang on."],
   ["Which does NOT increase supplier power?",["The supplier depends heavily on the industry for its revenue","Suppliers are more concentrated than the industry","Inputs are differentiated","Suppliers can credibly integrate forward"],"A supplier that depends on an industry will price reasonably to protect it."],
   ["A contestable market is one where:",["There are no sunk costs, so the threat of hit-and-run entry keeps prices competitive","There are many firms","A single firm is protected by a patent","Government sets prices"],"Contestability depends on free entry and exit, not on the number of firms."],
   ["In Porter's five forces article, government is:",["Not a sixth force; its policies should be analysed through their effect on the five forces","A sixth force that always lowers profitability","A sixth force that always raises profitability","Irrelevant to industry structure"],"Patents raise entry barriers; pro-union policies raise supplier power. Porter treats complements the same way."],
   ["Refrigerator, microwave and dishwasher makers are treated as one domestic appliance industry because:",["They face similar five forces: similar suppliers, customers and value chains, so supply-side substitution applies","Customers treat the products as substitutes","Government classifies them together","Most firms make all three"],"Consumers don't swap a fridge for a dishwasher, but manufacturers can switch plants and channels."],
   ["A truck maker targets independent owner-drivers who value comfort and are less price sensitive. This illustrates:",["Positioning the company where the competitive forces are weakest","Reshaping industry structure for everyone","Expanding the industry profit pool","Exploiting a change in technology"],"Owner-drivers are less price sensitive, so buyer power is weak in that segment."],
   ["Key success factors are identified by asking:",["What customers want and how a firm survives the competition","Which firm has the largest assets","What the government wants","Which segment is growing fastest"],"Grant's framework combines analysis of demand with analysis of competition."]
  ],
  heist:[
   ["Price competition is most likely when:",["Fixed costs are high and marginal costs are low","Products are highly differentiated","Industry demand is growing fast","Buyers face high switching costs"],"Firms cut price toward marginal cost to fill capacity, as in airlines and basic materials."],
   ["Average industry profitability is likely to be highest when:",["All five forces are weak","All five forces are strong","Rivalry is weak but buyers and suppliers are strong","Entry and substitutes are strong but rivalry is weak"],"Every strong force takes a share of the value created."],
   ["The five forces framework is best suited to:",["Assessing an industry's average profitability","Explaining profit differences between firms in the same industry","Valuing a single firm's shares","Judging managerial quality"],"Industry analysis explains average profit. Firm differences come from competitive advantage."],
   ["A steep excise duty on cigarettes is likely to:",["Both reduce demand and deter new entrants","Only reduce demand","Only deter entrants","Have no structural effect"],"Higher prices cut volume, while compliance and capital burdens raise entry barriers."],
   ["Which is a demand-side economy of scale?",["Buyers valuing a network more because more others use it","Spreading R&D over more units","Bulk discounts from suppliers","Learning-curve cost reductions"],"Network effects make customers reluctant to buy from a small newcomer."],
   ["Complementors capture more of the value when:",["Users can switch between industry rivals more easily than between complementors","Customers can easily buy and use the product without the complement","The industry is far more concentrated than the complementors","Only the industry can integrate into the complementors' business"],"Relative switching costs favour the side that is harder to replace."],
   ["Which is a common pitfall Porter warns about in industry analysis?",["Assuming a fast-growing industry is always attractive","Quantifying the forces","Looking at the full business cycle","Separating structural from cyclical change"],"Growth can attract entrants and empower suppliers. The other three are good practice."]
  ]},
{ id:"i", ini:"IM", crew:"The Inside Man", src:"Ch 4 · Further Topics", role:"Reads the guards and knows how they'll react.",
  room:"The guard post", roomLine:"The guards are watching you, and they're thinking about what you'll do next.",
  brief:[
   ["Where the five forces run out","<p>Industry factors explain <b>less than 20%</b> of the variation in firm profitability. Differences within industries are larger than differences between them. Industry analysis still matters for threats, segments and sources of advantage.</p><ul><li><b>Hypercompetition</b> (D'Aveni): rapid moves erode advantage; Schumpeter's 'gale of creative destruction'. Evidence of a general rise is mixed.</li><li><b>Winner-take-all</b> industries: positive feedback from <b>network externalities</b> makes market share decisive (Google search, console leaders).</li></ul>","Past quiz: industry factors account for a relatively small share of profit differences between firms."],
   ["Ecosystems and business models","<p>A <b>business ecosystem</b> is the wider community of organizations that affect the firm. Jacobides: value migrates, and firms can win <b>bottlenecks</b>:</p><ul><li><b>Guardian of quality</b>: Intel Inside, NutraSweet</li><li><b>Become irreplaceable</b>: Apple atomizes its suppliers' roles</li><li><b>Ride changing customer needs</b>: Paytm, PhonePe</li><li><b>Redefine the value chain</b>: IKEA shifted assembly to customers</li></ul><p>A <b>business model</b> is the core logic for creating value and converting it to profit. The <b>Business Model Canvas</b> maps partners, activities, resources, value proposition, relationships, channels, segments, costs and revenues. IndiGo: one aircraft type (A320), extreme unbundling, sale-and-leaseback financing.</p>",null],
   ["The value capture model","<p>Place the firm in its network of transacting parties.</p><ul><li><b>Upper limit</b> on the value it can capture: the value it adds to its current network, i.e. how much total value falls if it leaves.</li><li><b>Lower limit</b>: the value it could add to an alternative network.</li></ul><p>Moves with <b>competitive intent</b> raise the value the firm adds. Moves with <b>persuasive intent</b> affect how much others will concede. The model rests on cooperative game theory.</p>",null],
   ["The prisoners' dilemma","<p>Game theory frames interdependence: players, value added, rules, options, payoffs, sequence.</p><p>Coca-Cola and Pepsi each choose a big or small advertising budget. Both would do best with small budgets, but each fears the other will go big. Both go big: a <b>Nash equilibrium</b>, where no player gains by changing strategy alone, reached through a <b>maxi-min</b> choice.</p><p>Escapes: turn a one-off game into a <b>repeated game</b>, or change payoffs through <b>deterrence</b>.</p>",null],
   ["Five ways to shape the game","<ul><li><b>Cooperation</b>: Brandenburger and Nalebuff's <b>co-opetition</b>. Coke and Pepsi share school policies; Exxon and Shell run joint ventures.</li><li><b>Deterrence</b>: must be <b>credible</b>. A price-war threat hurts the incumbent more than the entrant; excess capacity is more credible (Monsanto before NutraSweet patents expired).</li><li><b>Commitment</b>: eliminating options. Cortés burned his ships; Airbus advertised the A380 early. Hard commitments are aggressive, soft ones moderate competition.</li><li><b>Changing the structure</b>: alliances, Tesla opening its patents.</li><li><b>Signaling</b>: selective information, misinformation (Operation Mincemeat), reputation (P&G's diaper wars), preannounced prices.</li></ul><p>Limits: stylized models give <b>no or multiple equilibria</b> and are sensitive to assumptions. Game theory is better at <b>explaining the past</b> than predicting.</p>",null],
   ["Competitor analysis","<p>Porter's framework asks four things about a rival to predict its moves and reactions:</p><ul><li><b>Current strategy</b>: what it says and what it does</li><li><b>Objectives</b>: market share goals make a fiercer rival; state-owned firms may ignore profit</li><li><b>Assumptions about the industry</b>: industry recipes create <b>blindspots</b></li><li><b>Resources and capabilities</b></li></ul><p>BSA and Harley-Davidson dismissed small Japanese bikes in the 1960s. By 1980 BSA and Triumph had stopped production. Competitive intelligence is legitimate; the line with industrial espionage is blurry.</p>",null],
   ["Segmentation","<p>Five stages:</p><ol style='margin:0;padding-left:20px;display:grid;gap:4px'><li>Identify key segmentation variables (buyer and product characteristics), combining correlated ones</li><li>Construct a segmentation matrix</li><li>Analyse segment attractiveness with the five forces. Entry comes from other segments, blocked by <b>mobility barriers</b></li><li>Identify each segment's KSFs</li><li>Choose segment scope: broad when KSFs are similar and costs are shared</li></ol><p>Unoccupied segments are the heart of <b>blue ocean strategy</b>. <b>Vertical segmentation</b> (Bain's profit pools) maps profit along the value chain.</p>","Past quiz: the purpose of segmentation analysis is to identify attractive segments, select strategies for each, and decide how many to serve."],
   ["Strategic groups","<p>A <b>strategic group</b> is the firms following the same or similar strategy on key dimensions. Indian airlines split into full-service carriers (Air India, Vistara) and low-cost carriers (IndiGo, SpiceJet).</p><p>Evidence of <b>sustained profit differences between groups is limited</b>: members may not even compete with each other (low-cost carriers on different routes). Strategic groups are mainly useful for understanding <b>positioning and patterns of competition</b>.</p>","A strategic group is not the same as a segment, and has nothing to do with collusion."]
  ],

    bins:["Cooperation","Deterrence","Commitment","Signaling","Changing the game"],
    items:[
     ["Monsanto builds unneeded aspartame capacity before its patents expire",1,"Excess capacity makes a threat of aggressive pricing credible."],
     ["Cortés destroys his ships on arrival in Mexico",2,"Eliminating the retreat option."],
     ["Airbus advertises the A380 heavily before finishing its design",2,"Visible sunk spending signals it won't back out."],
     ["Rivals preannounce price rises weeks in advance",3,"Communicating intentions to invite matching."],
     ["Coca-Cola and Pepsi agree common policies on soda in schools",0,"Rivals working together where interests align."],
     ["Tesla offers its patents to competitors",4,"Growing the EV market and spreading its technology."],
     ["P&G wages long share wars in diapers to build a reputation for toughness",3,"Reputation that protects its other markets."],
     ["The Mafia threatens reprisals so suspects keep silent",1,"Changes the payoffs in the prisoners' dilemma."],
     ["Exxon and Shell run joint ventures while competing for leadership",0,"Co-opetition."]
    ]},
  aud:[
   ["Two rivals each pick a big or small ad budget. Both would earn more if both went small, but each fears the other going big. The Nash equilibrium is:",["Both choose big budgets","Both choose small budgets","One big, one small","There is no equilibrium"],"Each fears the other going big, so both do. Neither can gain by changing alone."],
   ["For a deterrent threat to work, it must above all be:",["Credible","Secret","Made by the largest firm","Announced publicly"],"If carrying it out would hurt the threatener more, rivals will not believe it."],
   ["A general burns his own ships after landing, so retreat is impossible. In game theory this is:",["Commitment","Signaling through misinformation","Cooperation","Changing the structure of the game"],"Commitment binds a player to a course of action by removing alternatives."],
   ["Which is NOT part of Porter's competitor analysis framework?",["The competitor's share price volatility","Its current strategy","Its objectives","Its assumptions about the industry"],"The fourth element is its resources and capabilities."],
   ["Barriers that protect one segment from firms in other segments of the same industry are called:",["Mobility barriers","Entry barriers","Exit barriers","Switching costs"],"Entry barriers protect the whole industry; mobility barriers protect segments or groups."],
   ["Strategic group analysis is most useful for:",["Understanding strategic positioning and patterns of competition","Predicting large, lasting profit differences between groups","Measuring industry concentration","Identifying collusion"],"Research finds limited evidence of systematic profit differences between groups."],
   ["In a business ecosystem, a firm captures more value by:",["Controlling a bottleneck and becoming irreplaceable","Supplying a small, easily substituted component","Avoiding contact with end customers","Spreading into every activity equally"],"System integrators and guardians of quality tend to win the value battle."]
  ],
  heist:[
   ["Co-opetition refers to:",["Business relationships that combine competition and cooperation","A merger of rivals","Price-fixing","Ignoring competitors"],"Brandenburger and Nalebuff: no relationship is purely competitive or purely cooperative."],
   ["Why is threatening a price war often a weak deterrent to entry?",["It would damage the incumbent more than the entrant, so it lacks credibility","Price wars are illegal","Entrants never consider incumbents","It is too cheap to carry out"],"Investing in excess capacity is usually a more credible deterrent."],
   ["In the value capture model, the upper limit on value a firm can capture is:",["The value it adds to its current network","Its market capitalization","Its revenue","The value it could add to another network"],"The value it could add elsewhere is the lower limit."],
   ["A key limitation of game theory in strategy is that:",["Realistic models often give no equilibrium or many, and results are sensitive to assumptions","It cannot handle cooperation","It ignores rivals' decisions","It works only for monopolies"],"It is better at explaining past competitive situations than predicting new ones."],
   ["Established motorcycle makers dismissed small bikes from new foreign rivals because 'real riders want big bikes'. This illustrates:",["Blindspots created by shared assumptions about the industry","A signaling strategy","Mobility barriers","Hypercompetition"],"Shared beliefs about the industry kept incumbents from seeing the threat."],
   ["Which statement is true?",["The purpose of segmentation analysis is to find attractive segments, select strategies for them and decide how many to serve","Firms must compete in many segments to gain advantage","A strategic group is the set of firms in one segment","Firms in a strategic group engage in tacit collusion"],"Segment scope depends on whether KSFs are similar and costs can be shared."],
   ["A 'hard' commitment is one that:",["Commits a firm to aggressive competition","Signals a desire to avoid competition, such as announced profit targets","Can be reversed at no cost","Is kept secret from rivals"],"Soft commitments moderate competition; hard ones make aggression credible."]
