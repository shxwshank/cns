{ id:"q", ini:"QM", crew:"The Quartermaster", src:"Collis & Montgomery, Competing on Resources", role:"Picks the gear that won't break under pressure.",
  room:"The vault door", roomLine:"You're at the vault. Only the right gear gets you in, and keeps what's inside yours.",
  brief:[
   ["Bridging outside and inside","<p>Strategy swung from <b>industry analysis</b> (Porter's five forces: choose the right industry) to <b>core competence</b> and capabilities (look inside). The <b>resource-based view</b> (RBV) combines both.</p><p>Resources come in three forms: <b>physical</b> (the cable wire into your house), <b>intangible</b> (Disney's brand, Sharp's LCD know-how) and <b>organizational capabilities</b> embedded in routines, processes and culture (Japanese lean manufacturing).</p><p>A resource's value is set by the interplay of three market forces: <b>demand</b>, <b>scarcity</b> and <b>appropriability</b>. The value creation zone is where all three overlap.</p>","A brand that works for Disney fails for lobsters. Value is always relative to a market."],
   ["Test 1: inimitability","<p>Is it hard to copy? Four sources:</p><ul><li><b>Physical uniqueness</b>: a prime location, mineral rights, Merck's patents. Rarer than managers think.</li><li><b>Path dependency</b>: built over time and hard to accelerate. Gerber's baby-food trust; research findings that cumulate.</li><li><b>Causal ambiguity</b>: rivals can't tell what the resource is or how to recreate it. Rubbermaid's innovation; Southwest's culture.</li><li><b>Economic deterrence</b>: a large, scale-sensitive, market-specific investment rivals choose not to match. The first float-glass plant in a small market.</li></ul><p>IBP modernised meatpacking, then ConAgra and Cargill copied it and returns fell from 1.3% to 0.4%.</p>","Past quiz: Google's AI advantage from years of accumulated user data is path dependency."],
   ["Test 2: durability","<p>How quickly does it depreciate? Disney's brand survived nearly two decades of neglect between Walt Disney's death and Eisner's arrival. Semiconductor memory know-how is a rapidly wasting asset; each generation had a new leader.</p><p>Schumpeter's waves of innovation make most advantages transitory. Banking on the durability of a core competence is risky.</p>",null],
   ["Test 3: appropriability","<p>Who captures the value? Profits are bargained over by customers, distributors, suppliers and <b>employees</b>.</p><p>LBO firms' key resource was their network of deal relationships. It lived in <b>individuals</b>, who left to start their own funds. A resource not tied to the company makes profits hard to keep.</p>","A resource that 'resides in a consultant' or 'can walk out the door' fails this test."],
   ["Test 4: substitutability","<p>Can a different resource trump it? People Express built a unique no-frills system the majors couldn't copy. They didn't need to: they used a <b>different resource</b>, computer reservation systems and yield management, to match its fares. People Express went bankrupt.</p><p>Steel lost the beer can market to aluminium.</p>",null],
   ["Test 5: competitive superiority","<p>Whose resource is really better? Managers often treat core competence as a <b>feel-good exercise that no one fails</b>: the activity the firm does best internally. The right test is external, what it does <b>better than competitors</b>, for which <b>distinctive competence</b> is the better term.</p><p><b>Disaggregate</b>: 'consumer marketing' becomes brand management, then line extensions, couponing. A diagnostics maker found 'instrumentation' was really a superior <b>human interface</b>, so it hired ergonomists and moved into doctors' offices. Sometimes superiority lies in a combination (Honeywell's system integration).</p>",null],
   ["Invest, upgrade, leverage","<ul><li><b>Invest</b>: all resources depreciate. Eisner put $50m into Roger Rabbit and quadrupled animation; Marks & Spencer renovated while Sears diversified. But check the industry: Masco's metalworking competence earned low returns in structurally poor industries.</li><li><b>Upgrade</b>: add resources (Intel added the Intel Inside brand), move to alternative resources, or climb to better industries (Nucor). Sharp's 'seeds and needs' built calculators, then chips, then LCDs. Cooper bought Champion to learn global manufacturing.</li><li><b>Leverage</b> into markets where resources give advantage. Specific resources are powerful but don't travel; fungible ones (cash) travel but rarely give advantage.</li></ul><p>Three diversification errors: overestimating <b>transferability</b> (M&S in North America), overestimating ability to vault <b>entry barriers</b> (Philip Morris and 7-Up), assuming <b>generic</b> resources win anywhere (Chrysler and Gulfstream).</p>",null],
   ["Crossover terms from the quiz","<ul><li><b>Resource</b> is what the firm owns; <b>capability</b> is what it can do. In fast food, real estate is a resource and site-locating skill is a capability.</li><li><b>Distinctive competence</b>: an activity the firm does better than competitors.</li><li>Barney's VRIO: valuable and rare but <b>easy to imitate</b> gives a <b>temporary</b> advantage; valuable, rare and costly to imitate gives a sustained one.</li><li>The best strategies are often built on <b>intangible</b> resources.</li><li>The balance sheet does <b>not</b> show a firm's most valuable resources; brands and know-how are undervalued or missing.</li></ul>","These showed up in the 2023 quiz even though Grant's resource chapter isn't on your list."]
  ],
  job:{ title:"Test the gear", intro:"Each story shows a resource that failed or passed one of Collis and Montgomery's five tests. Name the test.",
    bins:["Inimitability","Durability","Appropriability","Substitutability","Competitive superiority"],
    items:[
     ["ConAgra and Cargill replicated IBP's automated beef plants",0,"The advantage was copied, so returns fell."],
     ["Semiconductor memory know-how lost value with every new generation",1,"A rapidly wasting asset."],
     ["LBO deal networks left with the partners who built them",2,"The value lived in individuals, not the firm."],
     ["Airlines used reservation systems to match People Express fares",3,"A different resource delivered the same result."],
     ["Every packaged-goods firm claims consumer marketing as its core competence",4,"Being good at something isn't enough; it must beat rivals."],
     ["Steel lost the beer can market to aluminium",3,"A substitute resource trumped the incumbent's."],
     ["Disney's brand survived two decades of neglect",1,"A long-lasting resource."],
     ["No rival can say exactly what makes Southwest's culture work",0,"Causal ambiguity blocks imitation."],
     ["A diagnostics maker traced its edge to the human interface, not 'instrumentation'",4,"Disaggregation found the truly superior skill."],
     ["Star traders capture most of the profits their skills generate",2,"Employees bargain away the rents."]
    ]},
  aud:[
   ["Applying the inimitability, durability and appropriability tests, which resource is most valuable?",["A brand built over decades as the industry pioneer","A technology licensed from a foreign firm for three years","A star marketing head hired last month","A creative team working on contract"],"The brand is path dependent, long lasting and owned by the firm. The others expire or can walk out."],
   ["A baby-food brand has built decades of parental trust that rivals can't buy even with huge ad budgets. This is hard to copy mainly because of:",["Path dependency","Physical uniqueness","Economic deterrence","Causal ambiguity"],"Consumer trust built over years cannot be bought instantly, even with huge advertising budgets."],
   ["Rivals can't pin down what makes a competitor's company culture work, so they can't copy it. This is:",["Causal ambiguity","Path dependency","Economic deterrence","Durability"],"Causally ambiguous resources are often capabilities embedded in social interactions."],
   ["A firm builds the first float-glass plant in a small country and rivals choose not to follow. This is:",["Economic deterrence","Causal ambiguity","Appropriability","Substitutability"],"The market can support only one plant of efficient scale, and the investment signals commitment."],
   ["A no-frills airline's system was too hard to copy, but big airlines matched its fares using a different resource: reservation systems and yield management. Which test did the no-frills airline's resources fail?",["Substitutability","Inimitability","Durability","Appropriability"],"Its no-frills system was hard to copy but could be trumped by a different resource."],
   ["Collis and Montgomery prefer 'distinctive competence' to 'core competence' because:",["A competence must be judged against competitors, not just against the firm's other activities","Core competence ignores customers","Distinctive competence is easier to measure","Core competence applies only to manufacturing"],"Core competence has too often become a feel-good exercise that no firm fails."],
   ["Resources that generate a temporary competitive advantage are:",["Valuable and rare but not costly to imitate","Valuable, rare and costly to imitate","Valuable but neither rare nor costly to imitate","Not valuable but rare"],"Rivals soon copy them. Sustained advantage needs imitation to be costly too."]
  ],
  heist:[
   ["Which property makes a resource LESS strategically valuable?",["It depreciates quickly","It is hard for rivals to copy","The firm captures most of the value it creates","It is superior to rivals' similar resources"],"Durability is one of the five tests."],
   ["A buyout firm's key resource is its partners' network of deal relationships. It struggles to keep the profits because the network:",["Resided in individuals who could leave","Were easily imitated by banks","Depreciated within months","Were substituted by online platforms"],"This is a failure of appropriability."],
   ["Highly fungible resources such as cash:",["Transfer easily across markets but rarely provide competitive advantage","Are the main source of competitive advantage","Cannot be moved across businesses","Are always path dependent"],"Specialized resources give advantage but lose value outside their setting."],
   ["A chip maker adds a consumer-facing brand on top of its technology. This is an example of:",["Upgrading resources by adding a new one","Leveraging a fungible resource","Economic deterrence","Straddling"],"Other routes: moving to alternative resources or into more attractive industries."],
   ["According to Collis and Montgomery, the value of a resource is determined by:",["The interplay of demand, scarcity and appropriability","Its book value","Its cost to acquire","Management's internal assessment"],"The five tests translate these market forces into practical checks."],
   ["In the fast-food industry, site-locating skill and real estate are, respectively:",["A capability and a resource","A resource and a capability","A competence and a trade-off","An opportunity and a threat"],"Resources are what the firm owns; capabilities are what it can do with them."]
  ]},
{ id:"t", ini:"TK", crew:"The Timekeeper", src:"Ch 8 · Industry Evolution and Strategic Change", role:"Knows when to strike and when to leave.",
  room:"The getaway", roomLine:"The industry is shifting under you. Adapt or get caught.",
  brief:[
   ["The industry life cycle","<p>Four phases: <b>introduction</b>, <b>growth</b>, <b>maturity</b>, <b>decline</b>, tracing an S-shaped sales curve. Two drivers: <b>demand growth</b> and the <b>creation and diffusion of knowledge</b>.</p><p>Life cycles vary: hotels are thousands of years old, MP3 players rose and fell in 20 years, and cycles are compressing online. Some industries <b>rejuvenate</b> (TVs: colour, flat-screen, HD; retailing waves). One industry can sit at different stages in different countries: cars are mature in the EU but growing in Asia.</p>",null],
   ["Dominant designs","<p>In the introduction stage rival technologies compete. Convergence produces a <b>dominant design</b>: an overall product architecture the industry adopts, such as the Underwood Model 5 typewriter, Ford's Model T, or McDonald's fast-food format.</p><p>A <b>technical standard</b> is different: a technology that ensures <b>compatibility</b>, arising from network effects and usually owned as intellectual property (Wintel). A firm that sets a dominant design usually owns no IP in it, so profit isn't guaranteed.</p><p>After the dominant design, emphasis shifts from <b>product innovation to process innovation</b>: Ford's moving assembly line cut the Model T price from $628 to $260.</p>",null],
   ["How each stage looks","<ul><li><b>Introduction</b>: early adopters, competing technologies, poor quality, few firms. KSF: product innovation, a credible image.</li><li><b>Growth</b>: rapid penetration, capacity shortages, entry. KSF: design for manufacture, distribution, brand, process innovation, <b>scaling up</b>.</li><li><b>Maturity</b>: replacement demand, knowledgeable price-sensitive buyers, commoditization, <b>shakeout</b>, production shifts to newly industrializing and then developing countries. KSF: <b>cost efficiency</b>.</li><li><b>Decline</b>: chronic overcapacity, price wars, exit. KSF: low overheads, buyer selection, signaling commitment, rationalizing capacity.</li></ul><p>R&D, capital investment and marketing intensity peak in growth and fall in maturity.</p>",null],
   ["Who survives","<p><b>Organizational ecology</b> studies populations of firms. Numbers rise fast as an industry gains legitimacy, then a <b>shakeout</b> at maturity: US tyre makers went from 1 in 1896 to 274 in 1922 to 49 in 1936.</p><p><b>Resource partitioning</b>: as giants consolidate (AB InBev, Heineken), niches open for specialists (craft brewers).</p><p><b>De novo</b> entrants are start-ups; <b>de alio</b> entrants diversify from related industries. De alio firms win when capabilities carry over: radio makers dominated TV. Innovators and consolidators are often different firms; start-ups must 'cross the chasm' to mainstream buyers.</p>",null],
   ["Why firms can't change","<ul><li><b>Organizational routines</b>: competency traps; core capabilities become <b>core rigidities</b></li><li><b>Social and political structures</b>: change threatens relationships and power</li><li><b>Conformity</b>: <b>institutional isomorphism</b>, imitating peers for legitimacy</li><li><b>Limited search</b>: <b>bounded rationality</b> and <b>satisficing</b>; exploitation crowds out exploration</li><li><b>Complementarities</b> among strategy, structure and systems: Liz Claiborne's tight system broke when reordering was allowed</li></ul><p>Result: <b>punctuated equilibrium</b>, long stability followed by radical, comprehensive change. Industry change mostly happens through firms dying and being born, not adapting.</p>",null],
   ["Technology that topples leaders","<ul><li><b>Competence-enhancing vs competence-destroying</b> (Tushman and Anderson): the turbofan strengthened jet engine makers; the quartz watch destroyed mechanical watchmakers' skills.</li><li><b>Component vs architectural</b> (Henderson and Clark): a hybrid engine is a component change; a battery-electric car changes the whole architecture. Boeing rose by redesigning the plane around the jet engine.</li><li><b>Sustaining vs disruptive</b> (Christensen): disruptive technology first underperforms on what mainstream customers value, grows in niches, then displaces incumbents. Steamships on inland waters; the 3.5-inch disk drive rejected by Seagate's customers.</li></ul>",null],
   ["Managing change","<ul><li><b>Dual strategies</b> (Abell) and <b>ambidexterity</b> (O'Reilly and Tushman). <b>Structural</b>: separate units for exploration (IBM built its PC in Florida; Shell GameChanger). <b>Contextual</b>: the same people explore and exploit (Oticon, Whirlpool).</li><li><b>Creating perceptions of crisis</b>: Welch at GE; Grove's 'only the paranoid survive'</li><li><b>Stretch targets</b> and BHAGs (Jobs and the iPod)</li><li><b>Corporate-wide initiatives</b> and symbolic acts (Haier's CEO smashing faulty fridges)</li><li><b>Reorganizing structure</b></li><li><b>New leadership</b>: an outside CEO helps most when the firm is performing poorly</li><li><b>Scenario analysis</b>: Shell's Mountains and Oceans. Not forecasts; the value is in the process of surfacing assumptions and testing strategies.</li></ul>",null],
   ["Building new capabilities","<p>Capabilities are <b>path dependent</b>, shaped by a firm's early history: Walmart's logistics from small-town stores, Toyota's lean production from post-war scarcity.</p><p>Build them <b>sequentially</b> through <b>product sequencing</b>: Hyundai moved from assembling a Ford Cortina to its own designs in compressed phases; Panasonic went from batteries to radios to TVs.</p><p><b>Dynamic capabilities</b> (Teece) are higher-order: sensing opportunities, seizing them, and reconfiguring assets. <b>Knowledge management</b>: <b>explicit</b> knowledge ('knowing about') spreads cheaply like a public good; <b>tacit</b> knowledge ('know-how') shows only in use. Nonaka's conversion spiral; the <b>paradox of replication</b>: making know-how explicit lets you scale it and lets rivals copy it.</p>",null]
  ],
  job:{ title:"Time the job", intro:"Place each observation at its stage of the industry life cycle.",
    bins:["Introduction","Growth","Maturity","Decline"],
    items:[
     ["Rival technologies compete; no dominant design yet",0,"Competition is between designs, not firms."],
     ["Customers are affluent, tech-savvy early adopters",0,"The market hasn't reached the mainstream."],
     ["Capacity shortages and rapid process innovation",1,"Demand outstrips capacity after a dominant design."],
     ["Scaling up production and winning distribution is the key challenge",1,"Growth-stage KSFs."],
     ["A shakeout: failure rates rise and firms exit",2,"Typical at the onset of maturity."],
     ["Products commoditize and price competition intensifies",2,"Knowledgeable buyers and standard products."],
     ["Production moves to newly industrializing countries",2,"Deskilled processes migrate to low-cost locations."],
     ["Chronic overcapacity and destructive price wars",3,"Demand is falling toward obsolescence."],
     ["KSFs are low overheads, buyer selection and rationalizing capacity",3,"Decline-stage priorities."]
    ]},
  aud:[
   ["Once a dominant design emerges, industries typically see:",["A shift from product innovation to process innovation","Faster radical product innovation","An end to all new entry","Immediate decline"],"Greater certainty about the design lets firms focus on efficiency and reliability."],
   ["How does a technical standard differ from a dominant design?",["A standard ensures compatibility and usually embodies owned IP; a dominant design is an overall configuration usually not owned","A dominant design always carries patents; a standard never does","They are the same thing","A standard appears only in declining industries"],"Standards arise where network effects make users want compatibility."],
   ["In the maturity stage, the key success factor tends to be:",["Cost efficiency through scale, low input costs and low overheads","Radical product innovation","Reaching early adopters","Building a credible image for a new product"],"Commoditization makes cost the main basis of advantage."],
   ["Resource partitioning describes:",["Specialists entering niches as an industry consolidates around a few giants","Firms dividing resources among divisions","Governments allocating spectrum","The split between tangible and intangible resources"],"Craft brewers growing as global brewers consolidated is Grant's example."],
   ["Institutional isomorphism causes inertia because firms:",["Imitate peers to gain legitimacy, locking in similar strategies and structures","Protect their political power","Stop searching once results are satisfactory","Have routines that are hard to change"],"The other options describe political structures, satisficing and routines."],
   ["For Swiss mechanical watchmakers, the quartz watch was:",["Competence-destroying","Competence-enhancing","A sustaining innovation","A component innovation only"],"It made their precision-engineering capabilities largely irrelevant."],
   ["Structural ambidexterity means:",["Creating separate units for exploration apart from core operations","The same people explore and exploit","Alternating between centralization and decentralization","Merging all R&D into one department"],"IBM developing its PC in Florida, far from headquarters, is the classic example."],
   ["The main value of scenario analysis is:",["Surfacing assumptions and testing strategies against different possible futures","Forecasting the oil price precisely","Replacing strategic planning","Choosing the single most likely future"],"Scenarios are not forecasts. They help you test strategies against different futures."]
  ],
  heist:[
   ["A disruptive technology:",["Initially underperforms on attributes mainstream customers value, then improves and displaces incumbents","Improves the performance attributes existing customers value","Is always adopted first by the industry leader","Only affects component suppliers"],"Leading customers resist it at first, which is why incumbents miss it."],
   ["Architectural innovations are especially hard for incumbents because they:",["Require reconfiguring how components link together, i.e. the whole system","Involve only one new component","Are always patented by rivals","Occur only in service industries"],"Incumbents know the components well but are organised around the old way they fit together."],
   ["Punctuated equilibrium describes organizations that:",["Stay stable for long periods, then undergo radical, comprehensive change","Change a little every year","Never change","Change only through acquisitions"],"Complementarities make piecemeal change hard, so misfit builds until a crisis forces change."],
   ["Dynamic capabilities are:",["Higher-order capabilities to sense, seize and reconfigure resources and competences","The fastest operational routines","Capabilities that depreciate quickly","Resources bought on the market"],"Teece: the ability to integrate, build and reconfigure competences for changing environments."],
   ["Tacit knowledge is:",["Know-how revealed through performance and transferred mainly by practice","Facts and instructions that can be written down","Easily copied by rivals","Protected mainly by patents"],"Explicit knowledge behaves like a public good; tacit knowledge doesn't."],
   ["A shakeout typically occurs:",["At the onset of maturity","During introduction","At the peak of growth","Only in decline"],"Failure rates jump and the number of firms falls sharply."],
   ["An outside CEO is most likely to lead change more effectively than an insider when:",["The organization is performing poorly","The firm is highly profitable","The industry is stable","The firm is newly founded"],"Grant cites evidence that outsiders help most in poor-performance situations."]
  ]}
];

 ["Which statement about strategy is NOT true?",["Operational effectiveness and competitive benchmarking should be treated as strategy","Grandiose statements of desire, on their own, are not strategy","Strategy is as much about deciding what not to do as what to do","Strategy is about creating superior value while containing the cost of creating it"],"OE is necessary but not sufficient. Benchmarking leads to competitive convergence.","2020"],

 ["Total value created equals:",["Both 'willingness to pay minus producers' willingness to sell' and 'producer surplus plus consumer surplus'","Selling price minus costs","Consumer surplus only","Profit plus taxes"],"Value created = customer value minus real cost, shared as consumer and producer surplus.","2024"],

s:[

 ["To judge how complements affect industry profitability, Porter says consider:",["Their influence on all five forces","Their influence on substitutes only","The demand for the complements","The advantage of complementors"],"Complements are not a sixth force; trace their effect through each of the five.","2024"],

 ["Barriers to entry are high when:",["Minimum efficient scale is large relative to total industry demand","Minimum efficient scale is small relative to demand","Economies of scale are low","Many firms already compete"],"An entrant must come in big (flooding the market) or accept a cost disadvantage.","2024"],

 ["Which is true about Porter's five forces?",["The framework remains valid even when one force lowers profitability and another raises it","Individual forces need not be analysed separately","Analysing a single force is usually enough","It applies only where rivalry is high"],"Forces rarely move in the same direction; combining them is a matter of judgment.","2020"],
 ["Which is NOT a step in industry analysis?",["Declaring the industry attractive or unattractive","Defining the relevant industry","Identifying the players in each force","Identifying the drivers of each force"],"Porter warns against using the framework to label industries rather than guide choices.","2020"],
 ["After a new retailer enters, two incumbents cut prices and spend more improving their radios. They have:",["Decreased industry profit potential","Increased exit barriers","Decreased exit barriers","Increased industry profit potential"],"Retaliation through price and spending transfers value away from the industry.","2020"],
 ["Smartphones now serve needs once met by music players, game devices and magazines. This is best known as:",["Industry convergence","Product differentiation","Backward integration","Customer myopia"],"Industry boundaries shift as products from different industries converge.","2020"],

 ["___ relates unit cost to the volume produced at a point in time; ___ relates unit cost to cumulative production.",["Economies of scale; experience curve","Experience curve; economies of scale","Economies of scale; competitive advantage","Competitive advantage; economies of scale"],"Both are cost-based sources of incumbent advantage.","2024"]

const SCRIPT = {
m:[
 {t:"What winners share", ask:"Why do some people win so big? Talent? Money?", l:[
  "Uhm, neither, really. Essentially, winners rarely start with the best resources.",
  "What I mean to say is, successful strategies share **four things**.",
  "One: **simple, consistent, long-term goals**.",
  "Two: **deep understanding of the competitive environment**.",
  "Three: **objective appraisal of your resources**. Four: **effective implementation**.",
  "Uhm, exam trap. 'A superior initial endowment of resources' is **not** on the list."]},
 {t:"The basic framework", ask:"How should I picture a strategy?", l:[
  "Essentially, strategy is the **link between the firm and its industry environment**.",
  "Firm side: goals, resources, structure. Industry side: competitors, customers, suppliers.",
  "Uhm, a good strategy fits both sides. That's **strategic fit**.",
  "And SWOT? What I mean to say is, the labels are arbitrary.",
  "**A strength can also be a weakness. An opportunity can also be a threat.**",
  "So just split things into **internal** and **external**. Essentially, simpler."]},
 {t:"Strategy vs tactics", ask:"What's the difference between strategy and tactics?", l:[
  "Uhm, strategic decisions are **important**, need **big resource commitments**, and are **hard to reverse**.",
  "Tactics are small moves. Essentially, a celebrity ad campaign is a tactic.",
  "Strategy itself? **A set of goal-directed actions to gain and sustain superior performance.**",
  "**Corporate strategy** answers **where to compete**. **Business strategy** answers **how to compete**.",
  "What I mean to say is, you earn more by being in an **attractive industry**, or by having a **competitive advantage** in it.",
  "Uhm, and advantage means beating rivals. In a protected monopoly there's no rival, so you can't really judge it."]},
 {t:"Why have a strategy", ask:"Why bother with strategy? Can't I just react?", l:[
  "Uhm, nobody can calculate every move. Essentially, strategy **simplifies decisions**, **coordinates** the crew and sets a **target**.",
  "Firms write it down. **Mission**: why we exist. **Values**: what we believe.",
  "**Vision**: what we want to be. **Strategy statement**: objectives, scope and advantage.",
  "What I mean to say is, don't trust the words. Check where they actually spend money."]},
 {t:"Plans vs reality", ask:"Do plans ever go the way they're written?", l:[
  "Uhm, rarely. **Intended strategy** is the plan.",
  "**Emergent strategy** comes from people reacting on the ground.",
  "Essentially, **realized strategy** mixes both, and it's mostly emergent.",
  "Like a company whose move into a new product began with plant managers. Top management adopted it later.",
  "What I mean to say is, the answer is **planned emergence**. Set a direction, let people adapt."]},
 {t:"Better is not different", ask:"If I'm faster and cheaper than everyone, isn't that a strategy?", l:[
  "Uhm, no. That's **operational effectiveness**: doing the **same things better** than rivals.",
  "TQM, benchmarking, outsourcing. Essentially, necessary, but **not strategy**.",
  "**Strategy** means doing **different things**, or the same things **differently**.",
  "Best practice spreads fast. Everyone moves toward the **productivity frontier**.",
  "That's the **most value you can deliver at a given cost** using the best practices around.",
  "What I mean to say is, everyone improves, nobody gets ahead. Benchmarking makes rivals look alike.",
  "Uhm, one more. Far **behind** the frontier you can improve quality and cost together. **At** the frontier, you must trade off."]},
 {t:"Three kinds of position", ask:"How do I pick a position that's really mine?", l:[
  "Uhm, three ways. **Variety-based**: a narrow set of products. Like a shop that only does oil changes.",
  "**Needs-based**: most needs of one customer group. Like flat-pack furniture for young budget buyers.",
  "**Access-based**: reaching customers in a different way. Like a cinema chain only in small towns.",
  "Essentially, any of the three works with a **cost** strategy or a **differentiation** strategy.",
  "What I mean to say is, each position needs its **own tailored activities**."]},
 {t:"Trade-offs and fit", ask:"What stops someone copying my position?", l:[
  "Uhm, **trade-offs**. More of one thing means less of another.",
  "Essentially, that's why you **can't be all things to all people**.",
  "Straddle two positions, like a no-frills airline that keeps full service, and the conflicts hurt both.",
  "So strategy is **choosing what not to do**.",
  "Second shield: **fit**. **First-order**: every activity is consistent with the strategy.",
  "**Second-order**: activities reinforce each other. **Third-order**: effort is optimized across them.",
  "What I mean to say is, rivals can copy one activity. Copying the **whole system** is nearly impossible.",
  "Uhm, and when a new position opens up, newcomers often take it. Incumbents face **trade-offs with what they already do**."]}
],
b:[
 {t:"What value is", ask:"Isn't value just the profit I make?", l:[
  "Uhm, no. **Value created = what customers are willing to pay − the real cost of production.**",
  "Customers keep **consumer surplus**: what they'd pay minus what they do pay.",
  "The firm keeps **producer surplus**. Essentially, total value = consumer surplus + producer surplus.",
  "What I mean to say is, if **price is the only basis of competition**, new value goes straight to **customers**."]},
 {t:"Whose value", ask:"Whose value am I chasing, the owners' or everyone's?", l:[
  "Uhm, the stakeholder view says serve everyone: owners, staff, customers, communities.",
  "Nice idea. But essentially, with many goals, **performance is hard to measure and managers hard to hold accountable**.",
  "So the working goal is **long-run profit**. Why? **Competition**, the **threat of takeover**, and interests **converge** over time.",
  "What I mean to say is, profit doesn't **always** match the social good. That's why CSR exists.",
  "Uhm, and still try to understand how stakeholders relate to each other, even when it's messy."]},
 {t:"Which profit", ask:"Profit is profit, right?", l:[
  "Uhm, no. **Accounting profit** ignores the cost of the owners' capital.",
  "**Economic profit = operating profit − capital employed × cost of capital.**",
  "Essentially, what's left after **all inputs, including capital**, are paid.",
  "What I mean to say is, a firm can show accounting profit and still destroy value."]},
 {t:"What a firm is worth", ask:"How do I put one number on the whole firm?", l:[
  "**Enterprise value = market value of equity + market value of debt.**",
  "Essentially, it's the present value of future free cash flows.",
  "Uhm, for a listed company, the **stock market value** is the best forward-looking measure we have."]},
 {t:"Reading performance", ask:"How do I tell if a firm is doing well, and why?", l:[
  "Uhm, look back with ratios: return on capital, equity, assets. Compare over time and against rivals.",
  "Then split it. **Return on assets = margin × asset turnover.**",
  "Margin side: cost of goods, overheads, depreciation. Turnover side: fixed assets, inventory, receivables.",
  "What I mean to say is, same margins but lower return? Look at **asset turnover**."]},
 {t:"Setting targets", ask:"How should I set targets for the crew?", l:[
  "Uhm, cascade that ratio tree down to each team.",
  "Or a **balanced scorecard**. Four views: **financial, customer, internal business, innovation and learning**.",
  "Essentially, there's **no supplier view**. Classic trap.",
  "What I mean to say is, chasing profit directly can backfire. Target what **drives** profit."]},
 {t:"Values and CSR", ask:"Do values and CSR have anything to do with profit?", l:[
  "Uhm, one view: a firm's only duty is profit within the rules. Another: firms are social entities.",
  "The middle ground: CSR helps through **sustainability, reputation, and licence to operate**.",
  "Essentially, **shared value** = creating economic value in a way that **also creates value for society**.",
  "What I mean to say is, grow the pie. Don't just split it differently."]},
 {t:"Small bets", ask:"Why pay for small bets that might never pay off?", l:[
  "Uhm, flexibility is worth money when the future is uncertain.",
  "Essentially, option value **rises with uncertainty** and **with time**. It **falls** if the investment cost rises.",
  "**Growth options**: small bets that open future businesses. Like a platform technology.",
  "**Flexibility options**: designs that can switch. Like a flexible production line.",
  "What I mean to say is, staged projects let you continue, change, wait or quit."]}
],
s:[
 {t:"Where to start", ask:"Where do I even start when I case an industry?", l:[
  "Uhm, don't scan everything. Essentially, focus on **customers, suppliers and competitors**.",
  "The five forces explain an industry's **average profitability**.",
  "Not why one firm beats another. What I mean to say is, it's an **industry-level** tool."]},
 {t:"The five forces", ask:"What exactly are the five forces?", l:[
  "Across: **substitutes, new entrants, rivalry**. Up and down: **buyer power, supplier power**.",
  "Essentially, profits are highest when **all five are weak**.",
  "**Substitutes** put a **ceiling on prices**. They bite when they offer better value and switching is cheap.",
  "Uhm, and it's the **threat** of entry, not actual entry, that holds profits down.",
  "What I mean to say is, a shift in structure can **raise or lower** profits. Either way."]},
 {t:"Keeping newcomers out", ask:"What keeps newcomers out of a juicy market?", l:[
  "Uhm, **capital requirements**. And **economies of scale**.",
  "If efficient scale is **large relative to demand**, entrants come in small and costly, or big with empty capacity.",
  "**Demand-side scale**, network effects: users flock to the biggest network. That's why only a few streaming apps survive.",
  "Essentially: **scale** is unit cost vs volume **right now**. The **experience curve** is unit cost vs **cumulative** output.",
  "Also **brand, distribution access, government policy, patents**, and **expected retaliation**.",
  "What I mean to say is, barriers are relative. A big firm from another industry jumps barriers that stop start-ups.",
  "Uhm, **slow growth is not an entry barrier**. And cheap, widely available inputs **lower** barriers.",
  "A **contestable market** has no sunk costs, so the threat of hit-and-run entry keeps prices low."]},
 {t:"Ugly rivalry", ask:"When does competition between existing players get ugly?", l:[
  "Uhm, many similar rivals. **Undifferentiated products**. Little customer loyalty.",
  "**Excess capacity** and **slow growth**. Essentially, everyone fights for share.",
  "**High exit barriers**: losers can't leave, so rivalry stays **intense**.",
  "**High fixed costs, low marginal costs**: you fill seats at almost any price.",
  "What I mean to say is, a **consolidated** industry is usually more profitable than a **fragmented** one.",
  "Uhm, and if incumbents meet an entrant with price cuts and extra spending, **industry profit falls**."]},
 {t:"Buyers and suppliers", ask:"How do I know who holds power, buyers or suppliers?", l:[
  "Buyer power = **price sensitivity** × **bargaining leverage**.",
  "Buyers get price sensitive when the item is a **big share of their costs**. Less so when quality really matters to them.",
  "Leverage: **a few large buyers** taking most sales, low switching costs, standard products, a threat to **integrate backward**.",
  "Uhm, suppliers are strong when **concentrated**, **differentiated**, able to **integrate forward**, and **not dependent on the industry**.",
  "Essentially, an artist forcing a streaming service to pay royalties? **Supplier power.**",
  "What I mean to say is, **bundling** raises switching costs. Number portability **lowers** them."]},
 {t:"Complements", ask:"What about products that go together, like printers and ink?", l:[
  "Uhm, **complements** raise demand for each other, and they **raise switching costs**.",
  "Porter says complements and government are **not a sixth force**. Trace their effect **through all five**.",
  "Essentially, a heavy tax can cut demand **and** scare off entrants at once.",
  "What I mean to say is, value goes to whoever is harder to replace."]},
 {t:"Using the analysis", ask:"I've cased it. What do I do with the analysis?", l:[
  "Uhm, three uses. **Forecast** profits. **Change** the structure. **Position** where forces are weakest.",
  "Like a truck maker serving owner-drivers who care about comfort, not price.",
  "Essentially, Porter's traps: thinking **fast growth** means attractive. Making lists. **Declaring an industry good or bad.**",
  "The model still works when one force pushes profit up and another pushes it down.",
  "Limits: it's a **static snapshot**, assumes **stable boundaries** and **similar products**.",
  "What I mean to say is, it **can** explain strong suppliers. That's one of the forces.",
  "Uhm, and when industries **converge**, like phones replacing music players, boundaries blur."]},
 {t:"Walls and winners", ask:"How do I decide where an industry's walls are? And what wins inside?", l:[
  "Uhm, draw the walls by **substitutability**, on the **supply side** too.",
  "Fridges and dishwashers aren't substitutes for buyers. But makers share plants, suppliers and customers. **Same five forces, same industry.**",
  "Essentially, the model isn't fussy about walls. Inside is **rivalry**, outside is **substitutes**.",
  "What I mean to say is, **key success factors** come from two questions: **What do customers want?** **How do firms survive the competition?**"]}
],
i:[
 {t:"Industry isn't everything", ask:"Why do firms in the same industry differ so much?", l:[
  "Uhm, industry explains **less than 20%** of profit differences between firms.",
  "Essentially, a **smaller** share than firm-level factors.",
  "What I mean to say is, industry and firm analysis are both useful, and together they still don't explain everything.",
  "Uhm, **hypercompetition**: fast moves erode advantages. **Winner-take-all**: network effects make share decisive."]},
 {t:"Ecosystems", ask:"Who else is in the picture besides rivals, buyers and suppliers?", l:[
  "Uhm, your **business ecosystem**: partners, complementors, platforms. Everyone who affects you.",
  "Essentially, you capture more value by **controlling a bottleneck** and becoming **irreplaceable**.",
  "What I mean to say is, a **business model** is the logic of how you create value and turn it into profit."]},
 {t:"Your share of the pie", ask:"How much of the pie can I actually capture?", l:[
  "**Upper limit**: the value you **add to your current network**. How much vanishes if you leave?",
  "Essentially, **lower limit**: the value you could add to another network."]},
 {t:"The prisoners' dilemma", ask:"Why do rivals end up hurting each other on purpose?", l:[
  "Uhm, picture two rivals choosing a big or small ad budget.",
  "Both would earn more if both went small. But each fears the other going big.",
  "Essentially, **both go big**. That's the **Nash equilibrium**: nobody gains by changing alone.",
  "What I mean to say is, escapes are making the game **repeated**, or changing the payoffs."]},
 {t:"Changing the game", ask:"How do I change how the guards play?", l:[
  "**Cooperation**. Uhm, **co-opetition** means competing and cooperating at the same time.",
  "**Deterrence**. Threats must be **credible**.",
  "A price-war threat hurts the incumbent more than the entrant, so it's weak. Building **excess capacity** is more believable.",
  "**Commitment**: remove your own options. Essentially, a general burning his ships so retreat is impossible.",
  "**Hard** commitments signal aggression. **Soft** ones signal you'll go easy.",
  "**Signaling**: reputation, preannounced price moves.",
  "What I mean to say is, game theory explains the past better than it predicts. Models give **no equilibrium or many**, and hinge on assumptions."]},
 {t:"Reading a rival", ask:"How do I predict what a rival will do next?", l:[
  "Uhm, four things. Their **current strategy**. Their **objectives**.",
  "Their **assumptions about the industry**. Their **resources and capabilities**.",
  "Essentially, shared industry beliefs create **blindspots**. Old bike makers laughed at small foreign bikes, then lost the market."]},
 {t:"Segmentation", ask:"How do I split a market into pieces worth attacking?", l:[
  "Uhm, pick variables, build a matrix, rate each segment with the five forces, find its key success factors.",
  "Essentially, the point: **find attractive segments, pick a strategy for each, decide how many to serve**.",
  "What I mean to say is, **mobility barriers** protect one segment from firms in other segments."]},
 {t:"Strategic groups", ask:"Aren't firms with similar strategies basically one gang?", l:[
  "Uhm, a **strategic group** is firms following similar strategies. Full-service airlines versus low-cost ones.",
  "Essentially, the evidence of lasting profit gaps between groups is weak.",
  "What I mean to say is, groups help you understand **positioning and patterns of competition**. Not collusion."]}
],
q:[
 {t:"What a resource is", ask:"What counts as a resource?", l:[
  "Uhm, three kinds. **Physical** assets. **Intangibles** like brands and patents. **Capabilities**: things you're good at.",
  "Essentially, **resource = what you own. Capability = what you can do.**",
  "Real estate is a resource. Picking great sites is a capability.",
  "Uhm, your rivals are **not** your resource. They're your environment.",
  "What I mean to say is, a resource's value comes from **demand, scarcity and appropriability** together."]},
 {t:"Can it be copied?", ask:"How do I know if a resource can be copied?", l:[
  "Four shields. **Physical uniqueness**: a prime spot, a patent.",
  "**Path dependency**: built over years, can't be rushed. Decades of brand trust. Years of user data.",
  "**Causal ambiguity**: rivals can't tell what makes it work. Like a company culture.",
  "**Economic deterrence**: a big, market-specific investment nobody will match. The first plant in a small market.",
  "Uhm, VRIO: **valuable, rare, costly to imitate**, and organized to capture it.",
  "Essentially, valuable and rare but **easy to copy**? Only a **temporary** advantage."]},
 {t:"Does it last?", ask:"Does a great resource last forever?", l:[
  "Uhm, a strong brand can last decades. Tech know-how can go stale in a year.",
  "Essentially, a resource that **depreciates quickly** is worth less."]},
 {t:"Who keeps the loot", ask:"If I own the resource, don't I keep all the profit?", l:[
  "Uhm, not always. Staff, suppliers and customers all bargain for a share.",
  "Essentially, if the resource lives in **people who can walk out**, the profit walks with them.",
  "What I mean to say is, a deal network held by a firm's partners fails this test. That's **appropriability**."]},
 {t:"Beaten by something else", ask:"What if a rival beats my resource with a different one?", l:[
  "Uhm, then you fail **substitutability**.",
  "A no-frills airline's system was hard to copy. Big airlines matched its fares with reservation systems and yield management instead.",
  "Essentially, steel lost beer cans to aluminium the same way."]},
 {t:"Really better?", ask:"Everyone says they're good at marketing. How do I know I really am?", l:[
  "Uhm, judge against **rivals**, not against your own other activities.",
  "Essentially, call it **distinctive competence**: something you do **better than competitors**.",
  "What I mean to say is, break it down. 'Marketing' is too broad. Which part do you do better?"]},
 {t:"Using your gear", ask:"So what do I do with my resources?", l:[
  "**Invest**: everything depreciates. Uhm, but analyse the industry first.",
  "Essentially, a classic mistake is investing in core competences **without an industry analysis**.",
  "**Upgrade**: add a new resource, like a chip maker adding a consumer brand. Or move to better industries.",
  "**Leverage** into new markets. What I mean to say is, **cash** travels easily but rarely gives an edge."]},
 {t:"Exam traps", ask:"Any terms the examiners like to trip people on?", l:[
  "Uhm, resource or capability? A streaming library is a **resource**. Making content is a **capability**.",
  "An airline's premium routes: **resource**. Great service: **capability**.",
  "Essentially, a pharma patent is an **inimitable** resource.",
  "What I mean to say is, five forces works at **industry** level. Resources work at **firm** level."]}
],
t:[
 {t:"Markets age", ask:"Do industries age like people?", l:[
  "Uhm, yes. **Introduction, growth, maturity, decline.**",
  "Essentially, life cycles are getting **shorter** as technology speeds up.",
  "What I mean to say is, some industries **rejuvenate**. TVs went colour, then flat, then HD."]},

  "**Decline**: overcapacity and **price wars**. Keep overheads low, cut capacity.",

function newLevel(W){
  const g = Array.from({length:17}, ()=>Array(W).fill("."));
  return { g, w:W, h:17, ents:[], ranges:[], crumb:{}, terms:[], spawn:{x:2*T, y:FL*T-30} };
}
function themeAt(x){ if(!L) return TH.hub; for(const r of L.ranges) if(x>=r.x0*T && x<r.x1*T) return TH[r.th]; return TH[L.ranges.length?L.ranges[L.ranges.length-1].th:"hub"]; }

function buildRun(spec){
  /* spec: [{id, qs:[Q...], label}] rooms in order. Returns level. */
  const L2 = newLevel(40 + spec.reduce((a,r)=>a+r.qs.length*30+10, 0));
  const g = L2.g; let x = 0;
  const col = (c, th, ceil)=>{ for(let y=FL;y<17;y++) g[y][c]="X"; if(ceil) g[0][c]="X"; };
  const theme = th => TH[th];
  let curTh = EXTRA[spec[0].id].theme;
  const flat = n => { const ce=theme(curTh).ceil; for(let i=0;i<n;i++) col(x+i,curTh,ce); x+=n; };
  for(let y=0;y<17;y++) g[y][0]="X";           /* left wall */
  flat(7);
  spec.forEach((room, ri)=>{
    const ex = EXTRA[room.id]; curTh = ex.theme;
    const r0 = ri===0?0:x;
    if(spec.length>1){ flat(3); L2.ents.push({type:"sign", x:(x-2)*T, y:FL*T-110, text:byId(room.id).room, sub:"Room "+(ri+1)+" of "+spec.length}); flat(2); }
    room.qs.forEach((Q, qi)=>{
      const hz = room.haz ? room.haz[qi] : ex.haz[qi % ex.haz.length];
      x += segment(L2, hz, x, curTh, qi);
      /* terminal zone */
      flat(6);
      const tx = (x-4)*T+2;
      const term = {type:"term", x:tx, y:FL*T-46, w:30, h:46, q:Q, done:false, label:ex.term, crew:room.id, style:room.id==="b"?"safe":"kiosk"};
      const gate = {type:"gate", x:(x-2)*T+8, y:0, w:16, h:FL*T, open:false, solid:true, term};
      term.gate = gate;
      L2.ents.push(term, gate); L2.terms.push(term);
    });
    L2.ranges.push({x0:r0, x1:x, th:curTh, id:room.id});
  });
  flat(10);
  L2.ents.push({type:"exit", x:(x-6)*T, y:FL*T-72, w:48, h:72});
  for(let y=0;y<17;y++){ g[y][x]="X"; g[y][x+1]="X"; }
  L2.w = x+2; L2.g = g.map(row=>row.slice(0,L2.w));
  L2.ranges[L2.ranges.length-1].x1 = L2.w;
  return L2;
}

function segment(L2, kind, x0, th, n){
  const g = L2.g, ce = TH[th].ceil, E = L2.ents;
  const R = (lo,hi)=>lo+Math.floor(Math.random()*(hi-lo+1));
  const colF = (c)=>{ for(let y=FL;y<17;y++) g[y][c]="X"; if(ce) g[0][c]="X"; };
  const carve = (a,b)=>{ for(let c=a;c<=b;c++) for(let y=FL;y<17;y++) g[y][c]="."; };
  const block = (c,h)=>{ for(let k=1;k<=h;k++) g[FL-k][c]="X"; };
  const coins = (cx, cy, k)=>{ for(let i=0;i<k;i++) E.push({type:"coin", x:(cx+i)*T+10, y:cy*T+8, w:12, h:14, got:false}); };
  const laser = (c, opt={})=>E.push(Object.assign({type:"laser", x:c*T+16, y1:ce?T:0, y2:FL*T, per:2.8, on:.38, ph:Math.random()*2}, opt));
  const trip = (c, opt={})=>E.push(Object.assign({type:"laser", trip:true, x:c*T+16, y1:FL*T-24, y2:FL*T, per:1, on:1, ph:0}, opt));
  const guard = (a,b,opt={})=>E.push(Object.assign({type:"guard", x:b*T, y:FL*T-40, w:22, h:40, a:a*T, b:b*T, dir:-1, sp:R(38,52), wait:0}, opt));
  const cam = (c,opt={})=>E.push(Object.assign({type:"cam", x:c*T+16, y:(ce?T:0)+10, mid:Math.PI/2, amp:0.45+Math.random()*0.2, per:4.8+Math.random()*1.6, ph:Math.random()*4, range:470, half:0.16, det:0}, opt));
  const [base, add] = kind.split("+");
  let w = 12;
  const fill = n2 => { w=n2; for(let i=0;i<w;i++) colF(x0+i); };
  switch(base){
    case "pit": { fill(11); const gp=R(2,3); carve(x0+4,x0+3+gp); coins(x0+4,11,gp); break; }
    case "pit2": fill(14); carve(x0+3,x0+5); carve(x0+8,x0+10); coins(x0+6,11,2); break;
    case "pit3": fill(18); carve(x0+2,x0+3); carve(x0+8,x0+9); carve(x0+14,x0+15); coins(x0+2,11,2); coins(x0+8,11,2); coins(x0+14,11,2); break;
    case "spikes": fill(13); for(let c=x0+3;c<=x0+5;c++) g[FL-1][c]="S"; block(x0+6,2); block(x0+7,2); for(let c=x0+8;c<=x0+10;c++) g[FL-1][c]="S"; coins(x0+6,10,2); break;
    case "spikes2": fill(21); for(let c=x0+2;c<=x0+18;c++) g[FL-1][c]="S"; for(const c of [3,4,5,6,9,10,11,12,15,16,17,18]) g[FL-2][x0+c]="X"; coins(x0+7,10,2); coins(x0+13,10,2); break;
    case "stairs": fill(15); block(x0+3,1); block(x0+4,2); block(x0+5,3); for(let c=x0+6;c<=x0+8;c++) g[FL-1][c]="S"; block(x0+9,3); block(x0+10,3); block(x0+11,2); block(x0+12,1); coins(x0+6,9,3); break;
    case "moving": { fill(14); carve(x0+3,x0+11); E.push({type:"mover", x:(x0+3)*T, y:FL*T, w:3*T, h:14, a:(x0+3)*T, b:(x0+9)*T, dir:1, sp:R(70,115), solid:true, dx:0, dy:0}); coins(x0+5,10,3); break; }
    case "elevator": { fill(13); carve(x0+3,x0+5); for(let c=x0+6;c<=x0+9;c++) block(c,6);
      E.push({type:"mover", axis:"y", x:(x0+3)*T, y:FL*T, w:3*T, h:14, a:(FL-6)*T-6, b:FL*T, dir:-1, sp:R(60,85), solid:true, dx:0, dy:0}); coins(x0+6,6,4); break; }
    case "spring": { fill(12); block(x0+6,5); block(x0+7,5); E.push({type:"spring", x:(x0+3)*T, y:FL*T-10, w:2*T, h:10, sq:0}); coins(x0+6,6,2); break; }
    case "laser": fill(16); [4,9,13].forEach((c,i)=>laser(x0+c,{per:2.7+Math.random()*0.5, ph:i*0.9+n*0.3})); coins(x0+6,12,4); break;
    case "laserFast": fill(16); [4,8,12].forEach((c,i)=>laser(x0+c,{per:2.0, on:.34, ph:i*0.45})); coins(x0+5,12,4); break;
    case "laserTrip": fill(16); trip(x0+3); laser(x0+6,{per:2.2,ph:n}); trip(x0+9); laser(x0+12,{per:2.2,ph:n+1.1}); trip(x0+14); coins(x0+8,11,3); break;
    case "laserMove": fill(17); trip(x0+4,{mv:true, a:(x0+3)*T+16, b:(x0+13)*T+16, sp:R(90,130), dir:1}); trip(x0+10,{mv:true, a:(x0+3)*T+16, b:(x0+13)*T+16, sp:R(60,90), dir:-1}); coins(x0+6,12,4); break;
    case "guard": fill(16); block(x0+4,2); for(let c=x0+5;c<=x0+10;c++) g[11][c]="X"; guard(x0+6,x0+13); coins(x0+6,10,4); break;
    case "guard2": fill(19); block(x0+8,2); block(x0+9,2); guard(x0+4,x0+7,{dir:1,x:(x0+4)*T}); guard(x0+11,x0+16); coins(x0+8,10,2); break;
    case "camera": fill(17); for(const c of [x0+4,x0+5,x0+11,x0+12]) block(c,2); cam(x0+8); coins(x0+6,12,4); break;
    case "cam2": fill(20); for(const c of [x0+3,x0+4,x0+9,x0+10,x0+15,x0+16]) block(c,2); cam(x0+6); cam(x0+13,{ph:2}); coins(x0+7,12,2); coins(x0+12,12,2); break;
    case "crumble": fill(15); carve(x0+2,x0+12); for(let c=x0+2;c<=x0+12;c++) g[FL][c]="C"; coins(x0+4,11,5); break;
    case "crumbleLong": fill(19); carve(x0+2,x0+16); for(let c=x0+2;c<=x0+16;c++) g[FL][c]="C"; g[FL][x0+9]="X"; coins(x0+5,11,3); coins(x0+12,11,3); break;
    case "crumbleSpikes": fill(16); for(let c=x0+2;c<=x0+13;c++){ g[FL][c]="C"; g[FL+1][c]="."; g[FL+2][c]="S"; } g[FL][x0+7]="X"; g[FL+1][x0+7]="X"; g[FL+2][x0+7]="X"; coins(x0+4,11,2); coins(x0+9,11,2); break;
    default: fill(12);
  }
  if(add==="laser") laser(x0+Math.floor(w/2)+ (base==="camera"?4:0), {per:2.3, ph:n});
  if(add==="camera") cam(x0+Math.floor(w/2)-2);
  if(add==="guard") guard(x0+6, x0+10);
  return w;
}

function buildHub(){
  const W = 48, L2 = newLevel(W), g = L2.g;
  for(let c=0;c<W;c++){ for(let y=FL;y<17;y++) g[y][c]="X"; g[0][c]="X"; }
  for(let y=0;y<17;y++){ g[y][0]="X"; g[y][W-1]="X"; }
  /* small stage for the vault door */
  L2.ranges.push({x0:0,x1:W,th:"hub"});
  L2.ents.push({type:"board", x:14*T, y:2*T+16, w:12*T, h:6*T});
  L2.ents.push({type:"table", x:17*T, y:FL*T-34, w:6*T, h:34});
  CREW.forEach((c,i)=>L2.ents.push({type:"npc", id:c.id, x:[4,8,12,28,32,36][i]*T, y:FL*T-34, w:22, h:34, face:1, bob:Math.random()*6}));
  L2.ents.push({type:"vault", x:42*T, y:FL*T-120, w:4*T, h:120});
  L2.spawn = {x:22*T, y:FL*T-30};
  return L2;
}

function spawnPlayer(x,y){ P = {x, y, w:20, h:30, vx:0, vy:0, on:false, face:1, coy:0, buf:0, jumps:0, dead:0, anim:0, ride:null, cx:x, cy:y}; }
function tileAt(tx,ty){ if(tx<0||tx>=L.w) return "X"; if(ty<0||ty>=L.h) return "."; return L.g[ty][tx]; }
function solidTile(tx,ty){ const c = tileAt(tx,ty); if(c==="X") return true; if(c==="C"){ const s=L.crumb[ty*L.w+tx]; return !(s && s.fallen); } return false; }
function solidPt(px,py){ return solidTile(Math.floor(px/T), Math.floor(py/T)); }
function solids(){ return L.ents.filter(e=>e.solid && !(e.type==="gate" && e.open)); }
function overlap(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }

function stepPlayer(dt){
  if(P.dead>0){ P.dead-=dt; if(P.dead<=0){ P.x=P.cx; P.y=P.cy; P.vx=0; P.vy=0; P.safe=1.8; } return; }
  const dir = (K.r?1:0) - (K.l?1:0);
  P.vx = dir*SPEED; if(dir) P.face = dir;
  if(KP.j) P.buf = 0.12; else P.buf = Math.max(0, P.buf-dt);
  P.coy = P.on ? 0.14 : Math.max(0, P.coy-dt); if(P.safe>0) P.safe-=dt;
  const dbl = G && G.mode==="heist" && hasPrize("q");
  if(P.buf>0){
    if(P.on || P.coy>0){ P.vy = -JUMP; P.on=false; P.coy=0; P.buf=0; P.jumps=1; P.ride=null; }
    else if(dbl && P.jumps<2){ P.vy = -JUMP*0.9; P.jumps=2; P.buf=0; }
  }
  if(!K.j && P.vy < -220 && !P.boost) P.vy = -220;           /* variable jump height */
  if(P.vy>=0) P.boost=false;
  P.vy = Math.min(P.vy + GRAV*dt, 900);
  /* ride moving platform */
  if(P.ride && P.on){ P.x += P.ride.dx; P.y += P.ride.dy||0; }
  /* X */
  const ox = P.x; P.x += P.vx*dt;
  const top=P.y+2, mid=P.y+P.h/2, bot=P.y+P.h-2;
  if(P.vx>0){ const r=P.x+P.w; if(solidPt(r,top)||solidPt(r,mid)||solidPt(r,bot)) P.x = Math.floor(r/T)*T - P.w - 0.01; }
  else if(P.vx<0){ const l=P.x; if(solidPt(l,top)||solidPt(l,mid)||solidPt(l,bot)) P.x = Math.floor(l/T)*T + T + 0.01; }
  for(const e of solids()) if(overlap(P,e) && e.type!=="mover"){ P.x = (ox+P.w/2 < e.x+e.w/2) ? e.x-P.w-0.01 : e.x+e.w+0.01; }
  /* Y */
  const oy = P.y; P.y += P.vy*dt; P.on=false; P.ride=null;
  const lx=P.x+3, rx=P.x+P.w-3;
  if(P.vy>=0){ const b=P.y+P.h; if(solidPt(lx,b)||solidPt(rx,b)){ P.y=Math.floor(b/T)*T-P.h; P.vy=0; P.on=true; P.jumps=0; } }
  else { const t=P.y; if(solidPt(lx,t)||solidPt(rx,t)){ P.y=Math.floor(t/T)*T+T+0.01; P.vy=0; } }
  for(const e of solids()){
    if(!overlap(P,e)) continue;
    if(oy+P.h <= e.y+6 && P.vy>=0){ P.y=e.y-P.h; P.vy=0; P.on=true; P.jumps=0; if(e.type==="mover") P.ride=e; }
    else if(e.type==="mover" && oy >= e.y+e.h-6){ P.y=e.y+e.h; P.vy=0; }
    else if(e.type!=="mover"){ P.x = (P.x+P.w/2 < e.x+e.w/2) ? e.x-P.w-0.01 : e.x+e.w+0.01; }
  }
  /* springs */
  for(const e of L.ents) if(e.type==="spring" && P.vy>=0 && P.x+P.w>e.x+2 && P.x<e.x+e.w-2 && P.y+P.h>=e.y-2 && P.y+P.h<=e.y+e.h+2){ P.vy=-940; P.on=false; P.boost=true; P.jumps=1; e.sq=0.25; }
  /* crumble trigger */
  if(P.on){ for(const px of [lx,rx]){ const tx=Math.floor(px/T), ty=Math.floor((P.y+P.h+2)/T); if(tileAt(tx,ty)==="C"){ const k=ty*L.w+tx; if(!L.crumb[k]) L.crumb[k]={t: (G&&G.mode==="heist"&&hasPrize("t"))?1.3:0.85, fallen:false, rt:0}; } } }
  P.anim += Math.abs(P.vx)*dt;
  /* hazards */
  if(P.y > L.h*T) return caught("You fell.");
  for(const [px,py] of [[P.x+4,P.y+P.h-3],[P.x+P.w-4,P.y+P.h-3],[P.x+P.w/2,P.y+P.h/2]]){ if(tileAt(Math.floor(px/T),Math.floor(py/T))==="S" && (py%T) > 18) return caught("Spikes."); }
}

function roomAt(x){ for(const r of L.ranges) if(x>=r.x0*T && x<r.x1*T) return r.id; return null; }
function caught(why){
  if(P.dead>0 || P.safe>0) return;
  P.dead = 0.75; flash = 0.5; G.busts++;
  if(G.mode==="heist"){ const rid=roomAt(P.x)||"x"; G.free=G.free||{};
    if(!G.free[rid]){ G.free[rid]=true; say(why+" Uhm, the crew covered you this once. No heat."); }
    else { G.heat++; say(why+" Heat +1."); if(G.heat>=MAX_HEAT) setTimeout(()=>endHeist(true), 700); } }
  else say(why+" Back to the last checkpoint.");
}
function say(t){ toast = {t, life:2.2}; }

function stepEnts(dt){
  const smoke = G && G.mode==="heist" && hasPrize("s");
  const jacket = G && G.mode==="heist" && hasPrize("i");
  for(const e of L.ents){
    if(e.type==="mover" && e.wait>0){ e.wait-=dt; e.dx=0; e.dy=0; }
    else if(e.type==="mover"){ if(e.axis==="y"){ const oy=e.y; e.y += e.dir*e.sp*dt; if(e.y>e.b){e.y=e.b;e.dir=-1;e.wait=1.1;} if(e.y<e.a){e.y=e.a;e.dir=1;e.wait=1.1;} e.dy=e.y-oy; e.dx=0; }
      else { const ox=e.x; e.x += e.dir*e.sp*dt; if(e.x>e.b){e.x=e.b;e.dir=-1;e.wait=0.5;} if(e.x<e.a){e.x=e.a;e.dir=1;e.wait=0.5;} e.dx = e.x-ox; e.dy=0; } }
    else if(e.type==="spring"){ e.sq=Math.max(0,(e.sq||0)-dt); }
    else if(e.type==="laser"){ if(e.mv){ e.x += e.dir*e.sp*dt; if(e.x>e.b){e.x=e.b;e.dir=-1;} if(e.x<e.a){e.x=e.a;e.dir=1;} }
      const on = e.trip ? 1 : (smoke ? e.on*0.62 : e.on); const ph=((time+e.ph)%e.per)/e.per; e.lit = ph<on; e.warn = !e.lit && ph>1-0.2;
      if(e.lit && P.dead<=0 && P.x < e.x+4 && P.x+P.w > e.x-4 && P.y+P.h > e.y1 && P.y < e.y2) caught("Laser tripped."); }
    else if(e.type==="guard"){
      if(e.wait>0){ e.wait-=dt; if(e.wait<=0) e.dir*=-1; }
      else { e.x += e.dir*e.sp*dt; if(e.x>e.b){ e.x=e.b; e.wait=1.6; } if(e.x<e.a){ e.x=e.a; e.wait=1.6; } }
      const face = e.wait>0 ? e.dir : e.dir;
      e.len = jacket ? 60 : 120;
      e.ex = e.x + (face>0? e.w : 0); e.ey = e.y+10;
      if(P.dead<=0){
        if(overlap(P,e)) { caught("The guard grabbed you."); continue; }
        const cx=P.x+P.w/2, cy=P.y+P.h/2;
        const fx = e.ex + face*e.len, y1 = e.ey-22, y2 = FL*T;
        const inX = face>0 ? (cx>e.ex && cx<fx) : (cx<e.ex && cx>fx);
        if(inX){ const f = Math.abs(cx-e.ex)/e.len; const top = e.ey + (y1-e.ey)*f, botm = e.ey + (y2-e.ey)*f; if(cy>top && cy<botm){ let blocked=false; const st=Math.floor(Math.abs(cx-e.ex)/8); for(let i=1;i<st;i++){ if(solidPt(e.ex+(cx-e.ex)*i/st, e.ey+(cy-e.ey)*i/st)){ blocked=true; break; } } if(!blocked) caught("Spotted by the guard."); } }
      }
    }
    else if(e.type==="cam"){
      e.ang = e.mid + e.amp*Math.sin((time+e.ph)*2*Math.PI/e.per);
      let seen=false;
      if(P.dead<=0){
        const cx=P.x+P.w/2, cy=P.y+P.h/2, dx=cx-e.x, dy=cy-e.y, d=Math.hypot(dx,dy);
        if(d<e.range){ let a=Math.atan2(dy,dx)-e.ang; while(a>Math.PI)a-=2*Math.PI; while(a<-Math.PI)a+=2*Math.PI;
          if(Math.abs(a)<e.half){ seen=true; const steps=Math.floor(d/8); for(let i=2;i<steps;i++){ const px=e.x+dx*i/steps, py=e.y+dy*i/steps; if(solidPt(px,py)){ seen=false; break; } } } }
      }
      e.det = seen ? e.det+dt : Math.max(0,e.det-dt*2);
      if(e.det>1.0){ e.det=0; caught("The camera saw you."); }
    }
  }
  for(const k in L.crumb){ const s=L.crumb[k];
    if(!s.fallen){ s.t-=dt; if(s.t<=0){ s.fallen=true; s.rt=3; } }
    else { s.rt-=dt; if(s.rt<=0){ const tx=k%L.w, ty=Math.floor(k/L.w); const r={x:tx*T,y:ty*T,w:T,h:T}; if(!overlap(P,r)) delete L.crumb[k]; } }
  }
}

/* =================================================================
   INTERACTION
   ================================================================= */
function near(e, pad){ return P.x+P.w > e.x-pad && P.x < e.x+e.w+pad && P.y+P.h > e.y-40 && P.y < e.y+e.h+20; }
function interactTarget(){
  if(!L || P.dead>0) return null;
  for(const e of L.ents){
    if(e.type==="term" && !e.done && near(e,18)) return e;
    if(e.type==="npc" && near(e,26)) return e;
    if(e.type==="vault" && near(e,10)) return e;
  }
  return null;
}
function stepInteract(){
  const t = interactTarget();
  if(KP.e && t){
    if(t.type==="term") openQuestion(t);
    else if(t.type==="npc") talk(t.id);
    else if(t.type==="vault") heistIntro();
  }
  if(G && G.mode!=="hub"){
    for(const e of L.ents){
      if(e.type==="coin" && !e.got && overlap(P,e)){ e.got=true; G.loot+=100; }
      if(e.type==="exit" && overlap(P,e) && P.dead<=0 && !G.over){ G.over=true; if(G.mode==="heist") endHeist(false); else endInterview(); }
    }
  }
}

function enterHub(msg){
  L = buildHub(); G = {mode:"hub", busts:0, loot:0};
  spawnPlayer(L.spawn.x, L.spawn.y); camX = 0; paused=false; hideOv();
  if(msg) say(msg);
}
function startInterview(id){
  const c = byId(id);
  L = buildRun([{id, qs:shuffle(pool(id)).slice(0,8).map(q=>prep(q,id))}]);
  G = {mode:"aud", id, busts:0, loot:0, correct:0, answered:0, log:[], over:false};
  spawnPlayer(L.spawn.x, L.spawn.y); P.cx=P.x; P.cy=P.y; camX=0; paused=false; hideOv();
  say(c.crew.replace("The ","")+": Uhm, essentially, reach every "+EXTRA[id].term.toLowerCase()+". I quiz you at each one.");
}
function startHeist(){
  const spec = ORDER.map(id=>({id, haz: shuffle(EXTRA[id].haz).slice(0,PER_ROOM), qs: shuffle(pool(id)).slice(0,PER_ROOM).map(q=>prep(q,id))}));
  L = buildRun(spec);
  G = {mode:"heist", busts:0, loot:0, correct:0, answered:0, log:[], heat:0, over:false,
       covers: hasPrize("m")?2:0, tips: hasPrize("b")?3:0, qtime: QTIME + (hasPrize("t")?20:0)};
  spawnPlayer(L.spawn.x, L.spawn.y); P.cx=P.x; P.cy=P.y; camX=0; paused=false; hideOv();
  say("Uhm, okay crew. Essentially: six rooms, 24 locks, keep the heat under five.");
}

/* ---------- learning conversation: one text box at a time ---------- */
const pick = (arr, k) => arr[k % arr.length];
const dlgEl = document.getElementById("dlg");
let DLG = null;
function parseLine(raw){
  const me = raw.startsWith(">"); const s = raw.replace(/^>\s*/,"");
  const segs = []; s.split(/(\*\*[^*]+\*\*)/).forEach(p=>{ if(!p) return; if(p.startsWith("**")) segs.push({t:p.slice(2,-2), b:true}); else segs.push({t:p, b:false}); });
  return { me, segs, len: segs.reduce((a,x)=>a+x.t.length,0) };
}
function partial(segs, n){ let out="", left=n; for(const g of segs){ if(left<=0) break; const t=g.t.slice(0,left); left-=t.length; out += g.b ? "<b>"+esc(t)+"</b>" : esc(t); } return out; }
function startDialog(id, lines, choices, tag){
  DLG = { id, lines: lines.map(parseLine), i:0, shown:0, choices, tag:tag||"", lastDrawn:-1 };
  paused = true; for(const k in K) K[k]=false;
  dlgEl.hidden = false; dlgDraw(true);
}
function endDialog(){ DLG = null; dlgEl.hidden = true; dlgEl.innerHTML = ""; paused = false; }
function dlgDraw(full){
  if(!DLG) return;
  const c = byId(DLG.id), ex = EXTRA[DLG.id], L0 = DLG.lines[DLG.i];
  const done = DLG.shown >= L0.len, last = DLG.i === DLG.lines.length-1;
  if(full || !dlgEl.firstChild){
    dlgEl.innerHTML = `<span class="dava" id="dAva"></span>
      <div class="dmain"><div class="dhead"><span class="dnm" id="dNm"></span><span class="dtag">${esc(DLG.tag)}</span></div>
      <p class="dtx" id="dTx"></p><div class="dft" id="dFt"></div></div>`;
  }
  const ava = document.getElementById("dAva"), nm = document.getElementById("dNm");
  ava.textContent = L0.me ? "YOU" : c.ini; ava.style.background = L0.me ? "#EDF1F7" : ex.col;
  nm.textContent = L0.me ? "You" : c.crew.replace("The ","");
  dlgEl.classList.toggle("me", L0.me);
  document.getElementById("dTx").innerHTML = partial(L0.segs, Math.floor(DLG.shown)) + (done ? "" : '<span class="caret"></span>');
  const ft = document.getElementById("dFt");
  if(done && last && DLG.choices){
    if(!ft.dataset.ch){ ft.dataset.ch = "1"; ft.innerHTML = `<div class="dch">${DLG.choices.map((c2,i)=>`<button class="btn ${i===0?'go':''}" data-ch="${i}"><span class="kk">${i+1}</span>${esc(c2.label)}</button>`).join("")}</div>`;
      const f = ft.querySelector("button"); if(f) f.focus({preventScroll:true}); if(DLG.onChoices) DLG.onChoices(); }
  } else {
    ft.dataset.ch = ""; ft.innerHTML = `<span class="dprog">${DLG.i+1} / ${DLG.lines.length}</span><span class="dnext">${done ? (last ? "E  close" : "E  next ▾") : "E  skip"}</span>`;
  }
  DLG.lastDrawn = Math.floor(DLG.shown);
}
function dlgAdvance(){
  if(!DLG) return;
  const L0 = DLG.lines[DLG.i];
  if(DLG.shown < L0.len){ DLG.shown = L0.len; return dlgDraw(); }
  if(DLG.i < DLG.lines.length-1){ DLG.i++; DLG.shown = 0; return dlgDraw(); }
  if(!DLG.choices) endDialog();
}
function dlgChoose(i){ if(!DLG || !DLG.choices) return; const L0=DLG.lines[DLG.i]; if(DLG.i<DLG.lines.length-1 || DLG.shown<L0.len) return; const ch = DLG.choices[i]; if(ch){ const fn=ch.fn; endDialog(); fn(); } }
function dlgTick(dt){ if(!DLG) return; const L0 = DLG.lines[DLG.i]; if(DLG.shown < L0.len){ DLG.shown = Math.min(L0.len, DLG.shown + dt*(reduce?9999:62)); if(Math.floor(DLG.shown)!==DLG.lastDrawn) dlgDraw(); } }
dlgEl.addEventListener("click", ev=>{ const b = ev.target.closest("[data-ch]"); if(b){ dlgChoose(Number(b.dataset.ch)); return; } dlgAdvance(); });

function talk(id, k){
  hideOv();
  const c = byId(id), ex = EXTRA[id], sc = SCRIPT[id], n = sc.length;
  S.les = S.les || {};
  const trial = { label: "Take the " + ex.lvl.toLowerCase(), fn: ()=>startInterview(id) };
  const later = { label: "Later", fn: ()=>{} };
  if(k===undefined && S.hired[id]){
    return startDialog(id, [`Uhm, rookie. Essentially, I'm on the crew. What I mean to say is, the **${ex.prize.toLowerCase()}** is yours for the heist.`],
      [ { label:"Hear the lessons again", fn:()=>talk(id,0) }, { label:"Retake the "+ex.lvl.toLowerCase(), fn:()=>startInterview(id) }, later ], "On the crew");
  }
  if(k===undefined) k = Math.min(S.les[id]||0, n);
  if(k >= n){
    return startDialog(id, ["Uhm, essentially, I've taught you everything I know.", `What I mean to say is, run my **${ex.lvl.toLowerCase()}**. Get **5 of 8** right and I'm in.`],
      [ trial, { label:"Hear the lessons again", fn:()=>talk(id,0) }, later ], "Ready");
  }
  const L0 = sc[k];
  const lines = (k===0 ? INTRO[id] : []).concat([">"+L0.ask], L0.l);
  const lastLesson = k === n-1;
  if(lastLesson) lines.push(`Uhm, okay. Essentially, now I test you. Every **${ex.term.toLowerCase()}** you reach in my ${ex.lvl.toLowerCase()}, I quiz you.`);
  const choices = lastLesson ? [ trial, later ]
    : [ { label:`Ask the next question (${k+2} of ${n})`, fn:()=>talk(id,k+1) }, { label:"Skip to the trial", fn:()=>startInterview(id) }, later ];
  startDialog(id, lines, choices, `Lesson ${k+1} of ${n} · ${L0.t}`);
  DLG.onChoices = ()=>{ S.les[id] = Math.max(S.les[id]||0, k+1); save(); };
}
function chatLine(side, ava, col, name, html, extra){
  return `<div class="line ${side}"><span class="ava sm" style="background:${col}">${ava}</span><div class="bw"><span class="nm">${name}</span><div class="bub ${extra||''}">${html}</div></div></div>`;
}
function whoHtml(c){ const ex=EXTRA[c.id]; return `<div class="who"><span class="ava" style="background:${ex.col}">${c.ini}</span><div><div class="n">${c.crew}</div><div class="s">Master thief · teaches ${esc(c.src)}</div></div></div>`; }

/* ---------- questions ---------- */
function openQuestion(term){
  const Q = term.q, heist = G.mode==="heist";
  OV = null;
  const st = {kind:"q", term, picked:null, left: heist?G.qtime:null};
  renderQ(st);
  if(heist){ qTimer = setInterval(()=>{ if(!OV || OV!==st || st.picked!==null) return; st.left--; const b=document.getElementById("qbar"), t=document.getElementById("qtxt"); if(b){ b.style.width=(st.left/G.qtime*100)+"%"; b.parentElement.classList.toggle("low", st.left<=15);} if(t) t.textContent=st.left+"s"; if(st.left<=0) answer(st,-1); }, 1000); }
}
function renderQ(st){
  const term=st.term, Q=term.q, c=byId(term.crew), heist=G.mode==="heist";
  const answered = st.picked!==null, ci = Q.opts.findIndex(o=>o.c);
  const idx = L.terms.indexOf(term)+1;
  const head = heist
    ? `<div class="meta"><span class="label">${esc(c.room)} · ${esc(term.label)} · lock ${idx} of ${L.terms.length}</span><span class="label">Heat ${G.heat}/${MAX_HEAT}${G.covers?` · cover ${G.covers}`:''}</span></div>
       ${!answered?`<div class="meta"><span class="label" id="qtxt">${st.left}s</span>${G.tips>0 && !Q.gone?`<button class="btn" data-a="tip" style="padding:5px 10px;font-size:13px">Use stethoscope 50/50 (${G.tips} left)</button>`:''}</div><div class="clock ${st.left<=15?'low':''}"><i id="qbar" style="width:${st.left/G.qtime*100}%"></i></div>`:''}`
    : `<div class="meta"><span class="label">${esc(c.crew)}'s trial · ${esc(term.label)} ${idx} of ${L.terms.length}</span><span class="label">${G.correct} right so far</span></div>`;
  const opts = Q.opts.map((o,i)=>{ let cls=""; if(answered){ if(o.c) cls="right"; else if(i===st.picked) cls="wrong"; } else if(Q.gone && Q.gone.includes(i)) cls="gone";
    return `<button class="opt ${cls}" data-a="pick" data-i="${i}" ${answered||(Q.gone&&Q.gone.includes(i))?'disabled':''}><span class="k">${i+1}</span><span>${esc(o.t)}</span></button>`; }).join("");
  let fb = "";
  if(answered){
    const ok = st.picked===ci;
    const aud = G.mode==="aud";
    fb = `<div class="explain ${ok?'good':'bad'}"><b>${st.picked===-1?'Out of time.':ok?(aud?pick(["Uhm, yes. Essentially, correct.","Essentially, yes.","Uhm... correct. Good."],idx):'Correct.'):(aud?pick(["Uhm, no. What I mean to say is,","Not quite. Essentially,","Uhm... no. What I mean to say is,"],idx):'Not quite.')}</b> ${ok?'':'Answer: '+esc(Q.opts[ci].t)+'. '}${esc(Q.e)}${st.note?`<br><b>${esc(st.note)}</b>`:''}</div>
      <div class="btns"><button class="btn go" data-a="qdone" data-focus>${term.style==="safe"?'Swing the door open':'Open the gate'}</button></div>`;
  }
  const icon = term.style==="safe" ? `<span class="label" style="color:var(--brass)">Crack the safe: the dial clicks on the right answer</span>` : "";
  const pastTag = Q.src ? `<span class="label" style="color:var(--cyan)">From a past C&amp;S quiz · ${esc(Q.src)}</span>` : "";
  ovc.innerHTML = `${head}${icon}${pastTag}<p class="q-text">${esc(Q.q)}</p><div class="opts">${opts}</div>${fb}`;
  ovEl.hidden=false; paused=true; for(const k in K) K[k]=false; OV=st;
  const f = ovc.querySelector("[data-focus]") || ovc.querySelector(".opt:not([disabled])"); if(f) f.focus({preventScroll:true});
}
function answer(st, i){
  if(st.picked!==null) return; stopQ();
  st.picked = i; const Q=st.term.q, ok = i>=0 && Q.opts[i].c;
  G.answered++;
  if(ok) G.correct++;
  else if(G.mode==="heist"){ if(G.covers>0){ G.covers--; st.note="Blueprint used: no heat for this miss."; } else { G.heat++; st.note="Heat +1."; } }
  G.log.push({q:Q.q, tag:st.term.crew, ok, ans:Q.opts.find(o=>o.c).t, pick: i>=0?Q.opts[i].t:"(timed out)", e:Q.e});
  renderQ(st);
  if(!ok) flash = 0.35;
}
function closeQ(st){
  const term = st.term; term.done = true; term.gate.open = true;
  P.cx = term.gate.x+term.gate.w+14; P.cy = FL*T-P.h;
  hideOv();
  if(G.mode==="heist" && G.heat>=MAX_HEAT) endHeist(true);
}
function overlayKey(ev){
  if(OV && OV.kind==="q" && OV.picked===null){ const m={"1":0,"2":1,"3":2,"4":3}; if(ev.key in m){ const b=ovc.querySelector(`.opt[data-i="${m[ev.key]}"]:not([disabled])`); if(b){ b.click(); ev.preventDefault(); } } }
  if(ev.key==="Escape" && OV && (OV.kind==="talk")){ hideOv(); }
}

function endHeist(alarm){
  if(G.ended) return; G.ended=true; stopQ();
  const R = {correct:G.correct, answered:G.answered, alarm, heat:G.heat, loot:G.loot, log:G.log};
  const share = alarm?0:Math.round(R.correct/24*30*10)/10;
  if(!alarm && (!S.best || R.correct>S.best.correct)){ S.best={correct:R.correct, share}; save(); }
  const rows = ORDER.map(id=>{ const X=R.log.filter(x=>x.tag===id); return {id, ok:X.filter(x=>x.ok).length, n:X.length}; });
  const weak = rows.filter(r=>r.n).sort((a,b)=>a.ok/a.n-b.ok/b.n)[0];
  const misses = R.log.filter(x=>!x.ok);
  showOv(`<span class="label">Debrief · ${R.answered} locks attempted</span>
    ${alarm?`<div class="big" style="color:var(--alarm)">Alarm tripped</div><p>Five heat. Uhm... essentially, the crew bailed. What I mean to say is, each run draws fresh questions and new obstacles, so go again.</p>`
           :`<div class="big">Clean <em>getaway</em></div><p>You took <b style="color:var(--brass)">${share.toFixed(1)}%</b> of Suchir's trade and ${R.loot} in loot.</p>`}
