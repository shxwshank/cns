      <div><span class="label">Exam equivalent</span><div class="score" style="font-size:clamp(40px,8vw,60px)">${Math.round(R.correct/24*25*10)/10}<small> / 25</small></div></div>
    </div>
    <div class="tbl"><table class="table"><thead><tr><th>Room</th><th>Chapter</th><th style="text-align:right">Right</th></tr></thead><tbody>
      ${rows.map(r=>{const c=byId(r.id);return `<tr><td>${esc(c.room)}</td><td>${esc(c.src)}</td><td class="n">${r.n?r.ok+'/'+r.n:'—'}</td></tr>`}).join("")}
    </tbody></table></div>
    ${weak && weak.ok<weak.n?`<p>Weakest room: <b style="color:var(--brass)">${esc(byId(weak.id).room)}</b>. Sit with ${esc(byId(weak.id).crew)} again.</p>`:''}
    ${misses.length?`<span class="label">What went wrong</span><div class="miss">${misses.map(m=>`<div class="m"><span class="label">${esc(byId(m.tag).room)}</span><span class="qq">${esc(m.q)}</span><span style="color:var(--alarm);font-size:13.5px">You chose: ${esc(m.pick)}</span><span class="aa">Answer: ${esc(m.ans)}</span><span class="ex">${esc(m.e)}</span></div>`).join("")}</div>`:''}
    <div class="btns"><button class="btn go" data-a="heist">Run it again</button><button class="btn" data-a="hub">Back to the hideout</button></div>`, {kind:"result"});
}

let resetArmed=false;
ovc.addEventListener("click", ev=>{
  const b = ev.target.closest("[data-a]"); if(!b || b.disabled) return;
  const a = b.dataset.a;
  if(a==="hub") return enterHub();
  if(a==="close") return hideOv();
  if(a==="teach") return talk(b.dataset.id, Number(b.dataset.k||0));
  if(a==="interview") return startInterview(b.dataset.id);
  if(a==="heist") return startHeist();
  if(a==="pick" && OV && OV.kind==="q") return answer(OV, Number(b.dataset.i));
  if(a==="qdone" && OV && OV.kind==="q") return closeQ(OV);
  if(a==="tip" && OV && OV.kind==="q" && G.tips>0){ const Q=OV.term.q; G.tips--; Q.gone = shuffle(Q.opts.map((o,i)=>o.c?-1:i).filter(i=>i>=0)).slice(0,2); return renderQ(OV); }
  if(a==="reset"){ if(!resetArmed){ resetArmed=true; b.textContent="Tap again to erase everything"; setTimeout(()=>{ resetArmed=false; if(b.isConnected) b.textContent="Reset progress"; },3000); return; }
    S={stars:{},hired:{},best:null,les:{}}; save(); resetArmed=false; return titleScreen(); }
});

/* =================================================================
   RENDER
   ================================================================= */
const BG = {};
function bgFor(th){
  if(BG[th]) return BG[th];
  let seed = th.length*977; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  const items=[]; for(let i=0;i<40;i++){ const w=40+rnd()*110, h= th==="roof" ? 120+rnd()*260 : 60+rnd()*300; items.push({x:i*95+rnd()*40, w, h, lights:Math.floor(rnd()*6)}); }
  return BG[th]=items;
}
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function draw(){
  const th = themeAt(camX+VW/2);
  const thKey = Object.keys(TH).find(k=>TH[k]===th);
  const gr = ctx.createLinearGradient(0,0,0,VH); gr.addColorStop(0,th.top); gr.addColorStop(1,th.bot);
  ctx.fillStyle = gr; ctx.fillRect(0,0,VW,VH);
  /* parallax */
  if(thKey==="roof"){ ctx.fillStyle="rgba(255,240,210,.85)"; ctx.beginPath(); ctx.arc(780-camX*0.05%200, 90, 34, 0, Math.PI*2); ctx.fill(); }
  const items = bgFor(thKey), par = 0.35, span = 40*95;
  for(const it of items){
    let x = ((it.x - camX*par) % span + span) % span - 120;
    if(x>VW+20) continue;
    ctx.fillStyle = th.deco;
    if(thKey==="roof"){ ctx.fillRect(x, FL*T-it.h+40, it.w, it.h); ctx.fillStyle="rgba(255,214,140,.35)"; for(let l=0;l<it.lights;l++) ctx.fillRect(x+8+(l%3)*14, FL*T-it.h+60+Math.floor(l/3)*22, 6, 8); }
    else if(thKey==="lab"||thKey==="vault"){ ctx.fillRect(x, 40, 10, FL*T-40); ctx.fillRect(x+it.w*0.6, 60, 4, FL*T-60); }
    else if(thKey==="ware"){ ctx.fillRect(x, FL*T-it.h*0.7, it.w, it.h*0.7); ctx.strokeStyle="rgba(255,255,255,.04)"; ctx.strokeRect(x+.5, FL*T-it.h*0.7+.5, it.w-1, it.h*0.35); }
    else if(thKey==="bank"){ ctx.fillRect(x, 40, 22, FL*T-40); ctx.fillRect(x-6, 40, 34, 10); ctx.fillRect(x-6, FL*T-12, 34, 12); }
    else { ctx.beginPath(); ctx.arc(x+it.w/2, FL*T, it.h*0.55, Math.PI, 0); ctx.fill(); }
  }
  ctx.save(); ctx.translate(-Math.round(camX), 0);
  /* tiles */
  const c0 = Math.max(0,Math.floor(camX/T)-1), c1 = Math.min(L.w-1, c0+32);
  for(let ty=0; ty<L.h; ty++) for(let tx=c0; tx<=c1; tx++){
    const c = L.g[ty][tx]; if(c===".") continue;
    const tt = themeAt(tx*T), x=tx*T, y=ty*T;
    if(c==="X"){ ctx.fillStyle=tt.blk; ctx.fillRect(x,y,T,T);
      if(tileAt(tx,ty-1)!=="X"){ ctx.fillStyle=tt.edge; ctx.fillRect(x,y,T,3); }
      ctx.fillStyle="rgba(0,0,0,.18)"; ctx.fillRect(x+T-1,y,1,T); ctx.fillRect(x,y+T-1,T,1); }
    else if(c==="S"){ ctx.fillStyle="#c9d2e3"; for(let i=0;i<4;i++){ ctx.beginPath(); ctx.moveTo(x+i*8,y+T); ctx.lineTo(x+i*8+4,y+T-16); ctx.lineTo(x+i*8+8,y+T); ctx.fill(); } }
    else if(c==="C"){ const s=L.crumb[ty*L.w+tx]; if(s&&s.fallen) continue; const sh = s? (Math.random()-0.5)*3 : 0;
      ctx.fillStyle=tt.blk; ctx.fillRect(x+sh,y,T,T*0.55); ctx.fillStyle=tt.edge; ctx.fillRect(x+sh,y,T,3);
      ctx.strokeStyle="rgba(0,0,0,.45)"; ctx.beginPath(); ctx.moveTo(x+sh+6,y+4); ctx.lineTo(x+sh+14,y+12); ctx.lineTo(x+sh+10,y+17); ctx.moveTo(x+sh+22,y+3); ctx.lineTo(x+sh+18,y+14); ctx.stroke(); }
  }
  /* entities */
  for(const e of L.ents) drawEnt(e);
  if(P) drawPlayer();
  /* prompt */
  const tgt = !paused && interactTarget();
  if(tgt){ const lbl = tgt.type==="term" ? (tgt.style==="safe"?"E  crack the safe":"E  use "+tgt.label.toLowerCase()) : tgt.type==="npc" ? "E  learn from "+byId(tgt.id).crew : "E  plan the heist";
    ctx.font="600 13px 'Martian Mono', monospace"; const w=ctx.measureText(lbl).width+18; const px=tgt.x+tgt.w/2-w/2, py=tgt.y-34;
    ctx.fillStyle="rgba(8,12,22,.88)"; rr(px,py,w,24,5); ctx.fill(); ctx.strokeStyle="#E8B04F"; ctx.stroke(); ctx.fillStyle="#EDF1F7"; ctx.fillText(lbl, px+9, py+16); }
  ctx.restore();
  if(flash>0){ ctx.fillStyle=`rgba(240,96,74,${flash*0.6})`; ctx.fillRect(0,0,VW,VH); }
  drawHud(th);
}

function drawPerson(x,y,face,col,coat,hat,anim,opts={}){
  const leg = Math.sin(anim/9)*5;
  ctx.fillStyle="#0b0d14";
  ctx.fillRect(x+4, y+22, 5, 8+ (opts.air?-2:0)); ctx.fillRect(x+11, y+22, 5, 8);
  if(!opts.air){ ctx.fillRect(x+4+leg*0.4, y+26, 5, 4); ctx.fillRect(x+11-leg*0.4, y+26, 5, 4); }
  ctx.fillStyle=coat; rr(x+1,y+10,18,15,4); ctx.fill();
  ctx.fillStyle="#e2b894"; ctx.fillRect(x+4,y+2,12,10);
  ctx.fillStyle=hat; ctx.fillRect(x+3,y-1,14,5); if(opts.cap){ ctx.fillRect(face>0?x+12:x-2,y+3,10,2); }
  ctx.fillStyle="#0b0d14"; ctx.fillRect(face>0?x+11:x+6, y+6, 3, 2);
  if(opts.mask){ ctx.fillStyle="#111"; ctx.fillRect(x+4,y+5,12,3); ctx.fillStyle="#fff"; ctx.fillRect(face>0?x+12:x+6,y+5,2,2); }
  ctx.fillStyle=col; ctx.fillRect(x+1,y+14,18,2);
}
function drawPlayer(){
  if((P.dead>0 && Math.floor(P.dead*12)%2===0) || (P.safe>0 && Math.floor(P.safe*10)%2===0)) return;
  drawPerson(P.x, P.y, P.face, "#E8B04F", "#1d2536", "#E8B04F", P.anim, {air:!P.on, mask:true});
}

function drawEnt(e){
  if(e.x > camX+VW+80 || e.x+ (e.w||0) < camX-200) { if(e.type!=="guard" && e.type!=="cam") return; }
  const t=time;
  if(e.type==="coin"){ if(e.got) return; ctx.fillStyle="#6FD39A"; rr(e.x,e.y+Math.sin(t*4+e.x)*2,12,14,2); ctx.fill(); ctx.fillStyle="#1a4a31"; ctx.fillRect(e.x+5,e.y+2+Math.sin(t*4+e.x)*2,2,10); }
  else if(e.type==="spring"){ const sq=e.sq>0?4:0; ctx.fillStyle="#6a738c"; ctx.fillRect(e.x+4,e.y+6,e.w-8,4); ctx.strokeStyle="#E8B04F"; ctx.lineWidth=2; ctx.beginPath(); for(let i=0;i<6;i++){ ctx.moveTo(e.x+8+i*9,e.y+6); ctx.lineTo(e.x+12+i*9,e.y-2+sq); } ctx.stroke(); ctx.lineWidth=1; ctx.fillStyle="#F0604A"; ctx.fillRect(e.x+2,e.y-4+sq,e.w-4,4); }
  else if(e.type==="mover"){ ctx.fillStyle="#8aa0c8"; ctx.fillRect(e.x,e.y,e.w,e.h); ctx.fillStyle="#E8B04F"; for(let i=0;i<e.w;i+=16) ctx.fillRect(e.x+i,e.y,8,4); }
  else if(e.type==="term"){
    if(e.style==="safe"){ ctx.fillStyle=e.done?"#3a6b4f":"#5c6474"; rr(e.x-6,e.y+6,42,40,4); ctx.fill(); ctx.fillStyle="#2a2f3a"; ctx.beginPath(); ctx.arc(e.x+15,e.y+26,11,0,Math.PI*2); ctx.fill(); ctx.strokeStyle=e.done?"#6FD39A":"#E8B04F"; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(e.x+15,e.y+26,11,0,Math.PI*2); ctx.stroke(); ctx.lineWidth=1;
      const a=e.done?0:t*1.5; ctx.beginPath(); ctx.moveTo(e.x+15,e.y+26); ctx.lineTo(e.x+15+Math.cos(a)*9,e.y+26+Math.sin(a)*9); ctx.stroke(); }
    else { ctx.fillStyle="#2b3246"; ctx.fillRect(e.x+8,e.y+20,14,26); ctx.fillStyle="#3b4460"; rr(e.x,e.y,30,24,3); ctx.fill();
      ctx.fillStyle=e.done?"#6FD39A":`rgba(143,200,236,${0.6+0.4*Math.sin(t*5)})`; ctx.fillRect(e.x+4,e.y+4,22,14);
      ctx.fillStyle="#0b0f1c"; ctx.font="700 10px 'Martian Mono', monospace"; ctx.fillText(e.done?"OK":"?", e.x+(e.done?9:12), e.y+15); }
  }
  else if(e.type==="gate"){ const h = e.open ? Math.max(0, (e.h)*(1-Math.min(1,(e.openT=(e.openT||0)+1/60)*2))) : e.h;
    if(e.open && h<=0) return; ctx.fillStyle="#5b6478"; for(let i=0;i<3;i++) ctx.fillRect(e.x+i*6, 0, 3, h); ctx.fillStyle="#E8B04F"; ctx.fillRect(e.x-2, h-8, e.w+4, 8); }
  else if(e.type==="exit"){ ctx.fillStyle="#1c2a22"; ctx.fillRect(e.x,e.y,e.w,e.h); ctx.strokeStyle="#6FD39A"; ctx.lineWidth=2; ctx.strokeRect(e.x+1,e.y+1,e.w-2,e.h-2); ctx.lineWidth=1;
    ctx.fillStyle="#6FD39A"; ctx.font="700 12px 'Martian Mono', monospace"; ctx.fillText(G.mode==="heist"?"VAN":"EXIT", e.x+(G.mode==="heist"?12:8), e.y-8); }
  else if(e.type==="sign"){ ctx.fillStyle="rgba(8,12,22,.75)"; rr(e.x-10,e.y,230,50,6); ctx.fill(); ctx.strokeStyle="rgba(232,176,79,.6)"; ctx.stroke();
    ctx.fillStyle="#E8B04F"; ctx.font="600 10px 'Martian Mono', monospace"; ctx.fillText(e.sub.toUpperCase(), e.x, e.y+17); ctx.fillStyle="#EDF1F7"; ctx.font="800 22px 'Big Shoulders Stencil Display', Impact, sans-serif"; ctx.fillText(e.text.toUpperCase(), e.x, e.y+41); }
  else if(e.type==="laser" && e.trip){ ctx.fillStyle="#394260"; ctx.fillRect(e.x-4,e.y1-4,8,e.y2-e.y1+4); ctx.fillStyle="rgba(255,60,60,.3)"; ctx.fillRect(e.x-6,e.y1,12,e.y2-e.y1); ctx.fillStyle="#ff4b3e"; ctx.fillRect(e.x-1,e.y1,2,e.y2-e.y1); }
  else if(e.type==="laser"){ ctx.fillStyle="#394260"; ctx.fillRect(e.x-7,e.y1,14,8); ctx.fillRect(e.x-7,e.y2-8,14,8);
    if(e.lit){ ctx.fillStyle="rgba(255,60,60,.25)"; ctx.fillRect(e.x-6,e.y1+8,12,e.y2-e.y1-16); ctx.fillStyle="#ff4b3e"; ctx.fillRect(e.x-2,e.y1+8,4,e.y2-e.y1-16); }
    else if(e.warn){ ctx.fillStyle=`rgba(255,80,60,${0.3+0.3*Math.sin(t*40)})`; ctx.fillRect(e.x-1,e.y1+8,2,e.y2-e.y1-16); }
    else { ctx.fillStyle="rgba(255,80,60,.12)"; for(let yy=e.y1+10; yy<e.y2-10; yy+=10) ctx.fillRect(e.x-1,yy,2,4); } }
  else if(e.type==="guard"){ const f=e.dir, len=e.len||170;
    ctx.fillStyle="rgba(255,230,120,.16)"; ctx.beginPath(); ctx.moveTo(e.ex,e.ey); ctx.lineTo(e.ex+f*len, e.ey-22); ctx.lineTo(e.ex+f*len, FL*T); ctx.closePath(); ctx.fill();
    ctx.save(); ctx.translate(e.x,e.y); ctx.scale(1.1,1.33); drawPerson(0,0,f,"#E8B04F","#2d3a52","#1a2233",e.wait>0?0:e.x,{cap:true}); ctx.restore();
    ctx.fillStyle="#ffe07a"; ctx.fillRect(f>0?e.x+e.w-2:e.x-4, e.y+12, 6, 4); }
  else if(e.type==="cam"){ const a=e.ang||Math.PI/2, r=e.range;
    ctx.fillStyle = e.det>0.05 ? `rgba(240,96,74,${0.22+e.det})` : "rgba(143,200,236,.13)";
    ctx.beginPath(); ctx.moveTo(e.x,e.y); ctx.arc(e.x,e.y,r,a-e.half,a+e.half); ctx.closePath(); ctx.fill();
    ctx.fillStyle="#6a738c"; ctx.fillRect(e.x-10,e.y-10,20,8); ctx.save(); ctx.translate(e.x,e.y); ctx.rotate(a); ctx.fillStyle="#aab3c8"; ctx.fillRect(0,-5,18,10); ctx.fillStyle=e.det>0.05?"#F0604A":"#8FC8EC"; ctx.fillRect(16,-3,4,6); ctx.restore(); }
  else if(e.type==="npc"){ const c=byId(e.id), ex=EXTRA[e.id], hired=S.hired[e.id];
    const face = P ? (P.x < e.x ? -1 : 1) : 1;
    drawPerson(e.x, e.y+4+Math.sin(time*2+e.bob)*1, face, ex.col, ex.coat, ex.hat, 0, {});
    ctx.font="800 14px 'Big Shoulders Stencil Display', Impact, sans-serif"; const nmw=ctx.measureText(c.crew.replace("The ","").toUpperCase()).width; ctx.font="600 9px 'Martian Mono', monospace"; const tgw=ctx.measureText(hired?("ON CREW · "+ex.pic):"WILL TEACH").width; const bw=Math.max(nmw,tgw)+18;
    ctx.fillStyle="rgba(8,12,22,.8)"; rr(e.x+11-bw/2,e.y-40,bw,32,5); ctx.fill(); ctx.strokeStyle=hired?"#6FD39A":ex.col; ctx.stroke();
    ctx.fillStyle="#EDF1F7"; ctx.font="800 14px 'Big Shoulders Stencil Display', Impact, sans-serif"; ctx.textAlign="center"; ctx.fillText(c.crew.replace("The ","").toUpperCase(), e.x+11, e.y-26);
    ctx.font="600 9px 'Martian Mono', monospace"; ctx.fillStyle=hired?"#6FD39A":"#A5B4CB"; ctx.fillText(hired?("ON CREW · "+ex.pic):"WILL TEACH", e.x+11, e.y-14); ctx.textAlign="left";
    if(!hired){ ctx.fillStyle=ex.col; ctx.font="900 18px 'Big Shoulders Stencil Display', Impact, sans-serif"; ctx.fillText("!", e.x+8, e.y-46+Math.sin(time*4)*2); } }
  else if(e.type==="board"){ ctx.fillStyle="#2a2034"; ctx.fillRect(e.x,e.y,e.w,e.h); ctx.strokeStyle="#9a82bd"; ctx.strokeRect(e.x+.5,e.y+.5,e.w-1,e.h-1);
    ctx.fillStyle="#EDF1F7"; ctx.font="900 25px 'Big Shoulders Stencil Display', Impact, sans-serif"; ctx.fillText("TARGET: SUCHIR'S LIQUOR SHOP", e.x+16, e.y+34, e.w-32);
    ctx.font="600 11px 'Martian Mono', monospace"; ctx.fillStyle="#A5B4CB"; ctx.fillText("Learn from 6 master thieves", e.x+16, e.y+56, e.w-32); ctx.fillText("Pass their trials · hit the shop", e.x+16, e.y+72, e.w-32);
    CREW.forEach((c,i)=>{ const x=e.x+16+i*60, y=e.y+96; const h=S.hired[c.id]; ctx.fillStyle=h?EXTRA[c.id].col:"#3a3048"; ctx.fillRect(x,y,48,60); ctx.fillStyle="#0b0f1c"; ctx.font="900 20px 'Big Shoulders Stencil Display', Impact, sans-serif"; ctx.fillText(c.ini, x+10, y+28);
      ctx.font="600 9px 'Martian Mono', monospace"; ctx.fillText(h?EXTRA[c.id].pic:"--", x+16, y+50); ctx.fillStyle="#F0604A"; ctx.beginPath(); ctx.arc(x+24,y-2,3,0,Math.PI*2); ctx.fill(); });
    ctx.strokeStyle="rgba(240,96,74,.6)"; ctx.beginPath(); CREW.forEach((c,i)=>{ const x=e.x+40+i*60, y=e.y+94; i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.stroke(); }
  else if(e.type==="table"){ ctx.fillStyle="#4a3a2c"; ctx.fillRect(e.x,e.y,e.w,8); ctx.fillRect(e.x+8,e.y+8,6,e.h-8); ctx.fillRect(e.x+e.w-14,e.y+8,6,e.h-8); ctx.fillStyle="#d9e3ef"; ctx.fillRect(e.x+30,e.y-3,60,4); ctx.fillStyle="#8FC8EC"; ctx.fillRect(e.x+100,e.y-4,40,5); }
  else if(e.type==="vault"){ const all = CREW.every(c=>S.hired[c.id]);
    ctx.fillStyle="#2e3343"; ctx.fillRect(e.x,e.y,e.w,e.h); ctx.fillStyle="#95a0b8"; ctx.beginPath(); ctx.arc(e.x+e.w/2,e.y+e.h/2,46,0,Math.PI*2); ctx.fill(); ctx.fillStyle="#2e3343"; ctx.beginPath(); ctx.arc(e.x+e.w/2,e.y+e.h/2,36,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle="#E8B04F"; ctx.lineWidth=4; for(let i=0;i<3;i++){ const a=time*0.3+i*2.09; ctx.beginPath(); ctx.moveTo(e.x+e.w/2,e.y+e.h/2); ctx.lineTo(e.x+e.w/2+Math.cos(a)*30,e.y+e.h/2+Math.sin(a)*30); ctx.stroke(); } ctx.lineWidth=1;
    ctx.fillStyle=all?"#6FD39A":"#E8B04F"; ctx.font="600 11px 'Martian Mono', monospace"; ctx.textAlign="center"; ctx.fillText(all?"CREW READY":"THE HEIST", e.x+e.w/2, e.y-10); ctx.textAlign="left"; }
}

function drawHud(th){
  ctx.font="600 11px 'Martian Mono', monospace";
  const pill=(x,y,w,txt,col)=>{ ctx.fillStyle="rgba(8,12,22,.78)"; rr(x,y,w,26,5); ctx.fill(); ctx.fillStyle=col||"#EDF1F7"; ctx.fillText(txt,x+10,y+17); };
  if(!G) return;
  if(G.mode==="hub"){ const n=CREW.filter(c=>S.hired[c.id]).length; pill(12,12,270,"HIDEOUT · "+n+" of 6 on the crew"); if(S.best) pill(270,12,190,"BEST HEIST "+S.best.correct+"/24","#E8B04F"); }
  else {
    const done = L.terms.filter(t=>t.done).length;
    const title = G.mode==="heist" ? "HEIST · "+themeAt(P.x).name.toUpperCase() : byId(G.id).crew.replace('The ','').toUpperCase()+"'S TRIAL · "+EXTRA[G.id].lvl.toUpperCase();
    ctx.font="600 11px 'Martian Mono', monospace"; const tw=ctx.measureText(title).width+20; pill(12,12,tw,title,"#E8B04F");
    pill(12,44,230,"LOCKS "+done+"/"+L.terms.length+" · RIGHT "+G.correct);
    const lootTxt="LOOT "+G.loot+" · CAUGHT "+G.busts; const lw=ctx.measureText(lootTxt).width+20; pill(VW-lw-12,12,lw,lootTxt);
    if(G.mode==="heist"){ ctx.fillStyle="rgba(8,12,22,.78)"; rr(VW-178,44,166,26,5); ctx.fill(); ctx.fillStyle="#EDF1F7"; ctx.fillText("HEAT",VW-168,61);
      for(let i=0;i<MAX_HEAT;i++){ ctx.strokeStyle="#F0604A"; ctx.strokeRect(VW-118+i*20+.5,50.5,14,14); if(i<G.heat){ ctx.fillStyle="#F0604A"; ctx.fillRect(VW-118+i*20,50,15,15); } }
      const perks=CREW.filter(c=>S.hired[c.id]).map(c=>EXTRA[c.id].pic); if(perks.length){ const pt="KIT "+perks.join(" "); const pw=ctx.measureText(pt).width+20; pill(VW-pw-12,76,pw,pt,"#6FD39A"); } }
  }
  if(toast){ ctx.font="600 13px 'Instrument Sans', sans-serif"; const w=Math.min(VW-40, ctx.measureText(toast.t).width+28); const a=Math.min(1,toast.life);
    ctx.globalAlpha=a; ctx.fillStyle="rgba(8,12,22,.9)"; rr(VW/2-w/2, VH-54, w, 34, 6); ctx.fill(); ctx.strokeStyle="#E8B04F"; ctx.stroke(); ctx.fillStyle="#EDF1F7"; ctx.textAlign="center"; ctx.fillText(toast.t, VW/2, VH-32); ctx.textAlign="left"; ctx.globalAlpha=1; }
}

/* =================================================================
   LOOP
   ================================================================= */
let last = performance.now();
function frame(now){
  const dt = Math.min(0.033, (now-last)/1000); last = now;
  if(L && !paused){
    time += dt;
    stepEnts(dt); stepPlayer(dt); stepInteract();
    const target = P.x - VW*0.4; camX += (Math.max(0, Math.min(L.w*T-VW, target)) - camX) * Math.min(1, dt*8);
  }
  dlgTick(dt);
  KP.j=false; KP.e=false;
  if(flash>0) flash=Math.max(0,flash-dt);
  if(toast){ toast.life-=dt; if(toast.life<=0) toast=null; }
  if(L) draw();
  requestAnimationFrame(frame);
}
enterHub(); paused=true; titleScreen();
requestAnimationFrame(frame);

</script>
